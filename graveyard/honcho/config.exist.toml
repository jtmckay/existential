# Honcho configuration — existential homelab stack.
#
# Rendered to config.toml on every ./existential.sh run (_ALWAYS_RENDER in
# src/templates.sh), so a model change in .env.shared lands on the next run.
#
# Model names come from the "Model Selection" block in .env.shared, so honcho,
# openviking and the model pulls always agree on which tags to use.
# DB credentials come from DB_CONNECTION_URI env var (set in docker-compose).
# Endpoints come from the "Model Endpoints" block in .env.shared, one per ROLE, so
# honcho's embeddings and its background extraction can sit on different machines.
# Each per-role key falls back to EXIST_MODEL_URL when blank (resolved in
# src/templates.sh), so a single-box install needs no change here.
# Each is an OpenAI-compatible base URL, so ollama and llama.cpp both serve it;
# api_key is a placeholder the client insists on, and neither server checks it.

[app]
LOG_LEVEL = "INFO"
EMBED_MESSAGES = true

[auth]
USE_AUTH = false

# Embeddings over the OpenAI-compatible endpoint — EXIST_MODEL_EMBED, EXIST_MODEL_EMBED_DIM dimensions.
# VECTOR_DIMENSIONS must match the model or the vector index is corrupt.
[embedding]
VECTOR_DIMENSIONS = EXIST_MODEL_EMBED_DIM

[embedding.model_config]
transport = "openai"
model = "EXIST_MODEL_EMBED"

[embedding.model_config.overrides]
base_url = "EXIST_MODEL_URL_EMBED"
api_key = "unused"

# Deriver: background worker that builds the user representation. It runs in the
# honcho-deriver container (`python -m src.deriver`), NOT in the API — the API
# only enqueues. High-volume background work, so the extract role defaults to the
# same tag as the chat role and only one model stays resident on a small card.
# (No EXIST_ token in this comment on purpose: templates.sh substitutes tokens in
# comments too, which turns "X defaults to Y" into "X defaults to X".)
[deriver]
ENABLED = true
# Process each work unit as soon as it appears instead of waiting for
# REPRESENTATION_BATCH_MAX_TOKENS (1024) to accumulate in it.
#
# A work unit is workspace:session:peer, so the threshold is per *conversation*.
# Upstream's default suits a busy multi-tenant server, where every session keeps
# growing. Here it strands short ones permanently: a finished 56-token hermes
# chat never gains the ~970 more tokens it would need, so nothing is ever
# derived from it. Measured on this install — after the deriver drained, the
# only rows left in `queue` were the four work units under the threshold.
#
# The cost is batching efficiency: more, smaller LLM calls against the extract
# endpoint. On a single-user homelab that is the right trade — the alternative
# is memory that silently skips every short conversation.
FLUSH_ENABLED = true

[deriver.model_config]
transport = "openai"
model = "EXIST_MODEL_EXTRACT"

[deriver.model_config.overrides]
base_url = "EXIST_MODEL_URL_EXTRACT"
api_key = "unused"

# Dialectic reasoning levels — all use EXIST_MODEL_EXTRACT at EXIST_MODEL_URL_EXTRACT.
[dialectic.levels.minimal.model_config]
transport = "openai"
model = "EXIST_MODEL_EXTRACT"

[dialectic.levels.minimal.model_config.overrides]
