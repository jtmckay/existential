services:
  # Node-based image generation UI (Stable Diffusion / SDXL)
  # Web UI at http://comfyui:8188 / https://comfyui.<domain>
  comfyui:
    container_name: comfyui
    # Pinned (was :latest-cuda) for reproducibility. Bump via ./existential.sh run check-versions.
    image: ghcr.io/ai-dock/comfyui:v2-cuda-12.1.1-base-22.04-v0.2.7

    # GPU wiring for anything that is not nvidia — see src/utils/gpu-vendor.sh.
    # The nvidia reservation below is stripped automatically when this applies.
    x-exist-gpu:
      amd:
        # ai-dock publishes a ROCm build at the same ComfyUI version as the CUDA
        # pin above, so this is a like-for-like swap rather than a version jump.
        # Bump both tags together via ./existential.sh run check-versions.
        image: ghcr.io/ai-dock/comfyui:v2-rocm-6.0-runtime-22.04-v0.2.7
        privileged: true
      none:
        # Nothing to add: the reservation is stripped so the container starts,
        # but this is a CUDA image and image generation on CPU is not practical.
        # Left explicit so the CPU case reads as considered, not forgotten.
        {}

    # NVIDIA GPU
    deploy:
      resources:
        limits:
          memory: 16G   # Adjust for your VRAM + CPU RAM needs
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video,display
      - DIRECT_ADDRESS=0.0.0.0
      - DIRECT_ADDRESS_GET_WAN=false
      - WEB_ENABLE_AUTH=false
      - CF_TUNNEL_TOKEN=
      - AUTO_UPDATE=false
      - COMFYUI_ARGS=${COMFYUI_ARGS:---listen 0.0.0.0}

    restart: unless-stopped
    networks:
      - exist
    # ports disabled — access via https://comfyui.<domain> (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - 8188:8188

    volumes:
      # GPU workspace: models + custom nodes + outputs. Re-downloadable — tier-3, not backed up.
      - ./comfyui_data:/workspace

networks:
  exist:
    external: true
