services:
  # LLM and OCR
  # Status check at http://ollama:11434/api/tags
  ollama:
    container_name: ollama
    image: ollama/ollama:0.32.14

    # GPU wiring for anything that is not nvidia. Applied by
    # src/generate-compose.ts from EXIST_GPU_VENDOR — see src/utils/gpu-vendor.sh.
    # The nvidia reservation below is stripped automatically when this applies.
    x-exist-gpu:
      amd:
        # Vulkan on the stock image, rather than the -rocm tag. privileged is
        # what actually grants /dev/dri here, and it is a deliberate exception
        # to the least-privilege convention in CLAUDE.md: it applies ONLY on an
        # AMD host, never by default. Narrow it to `devices:` if your setup
        # allows — this is the blunt version that works everywhere.
        privileged: true
        environment:
          OLLAMA_VULKAN: "1"

    # NVIDIA GPU or CPU
    deploy:
      resources:
        limits:
          memory: 12G   # Adjust up for large models (e.g. 32G for 70B+)
        reservations:
          devices:
            - driver: nvidia
              count: all # or a number, e.g. 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - exist
    environment:
      # VRAM guards. The stack targets an 8 GB card, where chat + embeddings
      # together already fill most of it; without these ollama will happily load
      # a third model on the next request and OOM the GPU mid-generation.
      #
      # 2 = the chat model and the embedding model, both resident. Raise this
      # (and the models in .env.shared's Model Selection block) on a bigger card.
      OLLAMA_MAX_LOADED_MODELS: "${EXIST_OLLAMA_MAX_LOADED_MODELS:-2}"
      # How long an idle model stays in VRAM. Long enough that back-to-back
      # requests don't pay the reload, short enough that a one-off vision or
      # transcription job hands the memory back.
      OLLAMA_KEEP_ALIVE: "${EXIST_OLLAMA_KEEP_ALIVE:-10m}"
      # One generation at a time. Parallel requests each get their own KV cache,
      # which is what actually blows the budget on a small card.
      OLLAMA_NUM_PARALLEL: "${EXIST_OLLAMA_NUM_PARALLEL:-1}"
    # ports disabled — access via https://ollama.<domain> (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - 11434:11434

    command: ["serve"]
    volumes:
      # Downloaded models — re-pullable, a _cache (not backed up). The ollama-decree
      # sidecar runs model routines, not a backup of this dir.
      - ollama_cache:/root/.ollama

  ollama-decree:
    container_name: ollama-decree
    image: existential/decree:local  # shared image, built by existential-adhoc
    pull_policy: never
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    restart: unless-stopped
    # Sidecar: pulls models over HTTP; the model lands on disk, not here.
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - ollama
    networks:
      - exist
    environment:
      - DECREE_DAEMON=true
      - DECREE_SIDECAR=true
      - DECREE_INTERVAL=2
      - IN_CONTAINER=1
      # The fallback for any role with no endpoint of its own.
      - EXIST_OLLAMA_URL=${EXIST_OLLAMA_URL:-http://ollama:11434}
      # Model globals from .env.shared — the ollama-pull routine resolves its
      # OLLAMA_ROLE against these, so migrations name a role, not a tag.
      # See the "Model Selection" block in .env.exist.shared.
      - EXIST_MODEL_CHAT=${EXIST_MODEL_CHAT}
      - EXIST_MODEL_CHAT_NUM_CTX=${EXIST_MODEL_CHAT_NUM_CTX}
      - EXIST_MODEL_EXTRACT=${EXIST_MODEL_EXTRACT}
      - EXIST_MODEL_EMBED=${EXIST_MODEL_EMBED}
      - EXIST_MODEL_VISION=${EXIST_MODEL_VISION:-}
      # ...and the per-role endpoints, so a role is pulled to the machine that
      # will actually serve it. Blank means "wherever EXIST_OLLAMA_URL points".
      # See the "Model Endpoints" block in .env.exist.shared.
      - EXIST_OLLAMA_URL_CHAT=${EXIST_OLLAMA_URL_CHAT:-}
      - EXIST_OLLAMA_URL_EXTRACT=${EXIST_OLLAMA_URL_EXTRACT:-}
      - EXIST_OLLAMA_URL_EMBED=${EXIST_OLLAMA_URL_EMBED:-}
      - EXIST_OLLAMA_URL_VISION=${EXIST_OLLAMA_URL_VISION:-}
    volumes:
      - ./decree:/work/.decree:z
      - ./exist.test.sh:/work/exist.test.sh:ro,z
      - ../../src/test/exist-test.sh:/src/test/exist-test.sh:ro,z
      - ../../automations/shared_routines:/work/.decree/shared_routines:ro,z
      - ../../automations/lib:/work/.decree/lib:ro,z
      - ../../automations/runs:/work/.decree/runs:z
      - ../../automations/secrets:/secrets:ro,z
    tty: false

x-exist-volumes:
  ollama_cache: {}

networks:
  exist:
    external: true
