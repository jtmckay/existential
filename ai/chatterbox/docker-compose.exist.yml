services:
  # TTS - text to speech
  # UI interface at http://localhost:8004/
  # API docs at http://localhost:8004/docs
  chatterbox:
    container_name: chatterbox
    image: ghcr.io/devnen/chatterbox-tts-server:2.0.0
    restart: unless-stopped
    # Rendered config.yaml carries a generated auth_password, so templates.sh
    # chmods it 0600 — readable by the host user only. Run as that user, or the
    # image's default uid cannot read its own config.
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    networks:
      - exist
    # ports disabled — access via https://chatterbox.internal (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - ${CHATTERBOX_PORT:-48004}:8000

    # GPU wiring for anything that is not nvidia — see src/utils/gpu-vendor.sh.
    # The nvidia reservation below is stripped automatically when this applies.
    x-exist-gpu:
      amd:
        # Same Vulkan path as ollama, and the same privileged exception: AMD
        # hosts only, never the default. The NVIDIA_* vars below are left in
        # place — without the nvidia container runtime they are inert.
        privileged: true
        environment:
          CHATTERBOX_DEVICE: vulkan

    # NVIDIA GPU
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # CPU only - comment out 'deploy' above and uncomment below
    # No additional configuration needed, device auto-detects to cpu

    environment:
      - HF_TOKEN=${CHATTERBOX_HF_TOKEN}
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./config.yaml:/app/config.yaml:Z
      - ./voices:/app/voices:Z
      - ./reference_audio:/app/reference_audio:Z
      - chatterbox_outputs_data:/app/outputs:Z
      - chatterbox_logs_cache:/app/logs:Z
      - chatterbox_cache:/app/hf_cache   # HuggingFace model cache — a _cache, re-downloadable

x-exist-volumes:
  chatterbox_cache: {}
  chatterbox_logs_cache: {}
  chatterbox_outputs_data: {}

networks:
  exist:
    external: true
