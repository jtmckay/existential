services:
  # TTS - text to speech
  # UI at https://chatterbox.<EXIST_DOMAIN>/ , API docs at /docs
  # config.yaml pins server.port to 8000, so that — not upstream's 8004 — is the
  # port Caddy and exist.test.sh talk to.
  chatterbox:
    container_name: chatterbox
    image: ghcr.io/devnen/chatterbox-tts-server:2.0.0
    restart: unless-stopped
    # Rendered config.yaml carries a generated auth_password, so templates.sh
    # chmods it 0600 — readable by the host user only. Run as that user, or the
    # image's default uid cannot read its own config.
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    networks:
      - exist
    # ports disabled — access via https://chatterbox.internal (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - ${CHATTERBOX_PORT:-48004}:8000

    # GPU wiring for anything that is not nvidia — see src/utils/gpu-vendor.sh.
    # The nvidia reservation below is stripped automatically when this applies.
    x-exist-gpu:
      # Considered, nothing to do. This is a CUDA image running PyTorch, which
      # has no Vulkan or ROCm inference path here — so the ollama-style
      # `privileged: true` + a vendor env var bought nothing: config.py reads
      # zero environment variables (0 hits for os.environ/getenv in upstream
      # config.py), so `CHATTERBOX_DEVICE` was never read by anything.
      # tts_engine.device: auto in config.yaml already falls back to CPU when
      # CUDA is not functional, which is the correct (slow) behaviour on every
      # non-nvidia host.
      amd: {}

    # NVIDIA GPU
    deploy:
      resources:
        limits:
          # A model server: the limit IS the model. The original checkpoint that
          # model.repo_id: chatterbox selects is t3_cfg 2.13GB + s3gen 1.06GB +
          # ve 6MB of fp32 weights, and on a GPU-less host (which is what a
          # fresh clone, CI and e2e all resolve to) all of that is resident in
          # system RAM alongside the torch runtime. 4G did not cover it.
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # The model loads in the FastAPI lifespan, and a failure there is only
    # logged — the server still binds and answers 200 on / and /docs with no
    # model at all. /api/model-info is the only endpoint that tells the two
    # apart, so health is keyed off its "loaded" flag rather than reachability.
    # No curl or wget in this image; python3 is the only HTTP client it has.
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8000/api/model-info', timeout=10))['loaded'] else 1)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 900s   # cold start downloads ~3.2GB of weights from HuggingFace

    environment:
      - HF_TOKEN=${CHATTERBOX_HF_TOKEN}
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # librosa JIT-compiles through numba at import, and numba caches next to
      # the source it compiled — inside dist-packages, which this container
      # cannot write because it runs as the host user rather than root. Without
      # somewhere else to put it the import raises
      #   RuntimeError: cannot cache function '__o_fold': no locator available
      # and the server crash-loops before it serves anything. Point it at the
      # cache volume that is already mounted and writable.
      - NUMBA_CACHE_DIR=/app/hf_cache/numba
    volumes:
      - ./config.yaml:/app/config.yaml:Z
      - ./voices:/app/voices:Z
      - ./reference_audio:/app/reference_audio:Z
      - chatterbox_outputs_data:/app/outputs:Z
      - chatterbox_logs_cache:/app/logs:Z
      - chatterbox_cache:/app/hf_cache   # HuggingFace model cache — a _cache, re-downloadable

x-exist-volumes:
  chatterbox_cache: {}
  chatterbox_logs_cache: {}
  chatterbox_outputs_data: {}

networks:
  exist:
    external: true
