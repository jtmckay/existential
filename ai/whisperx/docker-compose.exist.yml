services:
  # STT — speech to text with speaker diarization (WhisperX)
  # API + Swagger UI at https://whisperx.internal/docs
  whisperx:
    container_name: whisperx
    image: ghcr.io/pavelzbornik/whisperx-fastapi:0.8.0
    # Runs as the image's root user: it's a CUDA image that caches HuggingFace
    # models into /root/.cache (same exception as the old whisper / mcp images).
    restart: unless-stopped

    # GPU wiring for anything that is not nvidia — see src/utils/gpu-vendor.sh.
    # The nvidia reservation below is stripped automatically when this applies.
    #
    # Both non-nvidia cases fall back to CPU, for the same reason: whisperx runs
    # on faster-whisper/CTranslate2, which has CUDA and CPU backends and no ROCm
    # one. Without this the container starts with DEVICE=cuda and dies on the
    # first request looking for a CUDA runtime that is not there — the failure
    # the stripped reservation would otherwise hide until transcription time.
    x-exist-gpu:
      amd:
        environment:
          DEVICE: cpu
      none:
        environment:
          DEVICE: cpu

    # NVIDIA GPU — large-v3 in int8 (~3 GB VRAM) leaves room alongside ollama.
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    networks:
      - exist
    # ports disabled — access via https://whisperx.internal (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - 48000:8000

    environment:
      # ML config — int8 is required on shared/limited VRAM; large-v3 is the
      # most accurate model that still fits the 6 GB 3060 alongside other GPU apps.
      # These four are read by the OpenAI-compatible /v1/audio/* path only (what
      # open-webui uses). The async /speech-to-text* path ignores them: every
      # WhisperModelParams field is a query param with a *hardcoded* default
      # (model=tiny, device=cuda, compute_type=float16 — app/schemas.py:334), so
      # a caller must send its own or a CPU-only host fails every task with
      # "CUDA driver version is insufficient". automations/lib/whisperx-transcribe.ts
      # sends them.
      WHISPER_MODEL: large-v3
      DEVICE: cuda
      COMPUTE_TYPE: int8
      DEFAULT_LANG: en
      # Diarization (pyannote) needs a HuggingFace token with the
      # pyannote/speaker-diarization-community-1 terms accepted — that is the
      # model whisperx 0.8.0 asks for (whisperx/diarize.py:101), not the 3.1 the
      # older guides name. Without it the task fails at the diarize step with a
      # 401 while /health still reports ok.
      HF_TOKEN: ${WHISPERX_HF_TOKEN}
      # SSRF protection ships ON and blocks every RFC1918 range — including
      # 172.16/12, where the `exist` bridge lives. That silently defeats the whole
      # point of /speech-to-text-url: the MinIO pre-signed URL the auto-transcription
      # flow hands over resolves to a bridge or LAN address and comes back
      # 422 SSRF_BLOCKED. whisperx publishes no ports and is reachable only from
      # inside the stack, so the private ranges the stack itself uses are re-allowed;
      # loopback and link-local (169.254.169.254 — cloud metadata) stay blocked.
      SSRF_BLOCKED_NETWORKS: '["0.0.0.0/8","100.64.0.0/10","127.0.0.0/8","169.254.0.0/16","192.0.0.0/24","192.0.2.0/24","192.88.99.0/24","198.18.0.0/15","198.51.100.0/24","203.0.113.0/24","224.0.0.0/4","240.0.0.0/4","255.255.255.255/32","::1/128"]'
      # SQLite holds task results + the speaker-embedding database (persisted volume).
      DB_URL: sqlite:////data/db/records.db
      ENVIRONMENT: production
      DEV: "false"
      LOG_LEVEL: INFO

    volumes:
      - whisperx_cache:/root/.cache                             # HF + torch model cache — a _cache, re-downloadable
      # SQLite tasks + speaker-embedding DB — db: true (NFS breaks WAL locking).
      # TODO: no backup yet — add a volume-backup cron in
      # services/decree/decree-backup/cron.example/ (nothing else is needed).
      - whisperx_db_data:/data/db

x-exist-volumes:
  whisperx_db_data: { db: true }
  whisperx_cache: {}

networks:
  exist:
    external: true
