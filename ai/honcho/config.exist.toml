# Honcho configuration — existential homelab stack.
#
# Rendered to config.toml on every ./existential.sh run (_ALWAYS_RENDER in
# src/templates.sh), so a model change in .env.shared lands on the next run.
#
# Model names come from the "Model Selection" block in .env.shared, so honcho,
# openviking and the ollama migrations always agree on which tags to use.
# DB credentials come from DB_CONNECTION_URI env var (set in docker-compose).
# All LLM calls route through ollama at EXIST_OLLAMA_URL (.env.shared) — the one
# place that address is named, so pointing the stack at another host moves honcho too.

[app]
LOG_LEVEL = "INFO"
EMBED_MESSAGES = true

[auth]
USE_AUTH = false

# Embeddings via Ollama — EXIST_MODEL_EMBED, EXIST_MODEL_EMBED_DIM dimensions.
# VECTOR_DIMENSIONS must match the model or the vector index is corrupt.
[embedding]
VECTOR_DIMENSIONS = EXIST_MODEL_EMBED_DIM

[embedding.model_config]
transport = "openai"
model = "EXIST_MODEL_EMBED"

[embedding.model_config.overrides]
base_url = "EXIST_OLLAMA_URL/v1"
api_key = "ollama"

# Deriver: background worker that builds the user representation.
# High-volume background work — EXIST_MODEL_EXTRACT defaults to the same tag as
# EXIST_MODEL_CHAT so only one model stays resident on a small card.
[deriver]
ENABLED = true

[deriver.model_config]
transport = "openai"
model = "EXIST_MODEL_EXTRACT"

[deriver.model_config.overrides]
base_url = "EXIST_OLLAMA_URL/v1"
api_key = "ollama"

# Dialectic reasoning levels — all use EXIST_MODEL_EXTRACT via Ollama.
[dialectic.levels.minimal.model_config]
transport = "openai"
model = "EXIST_MODEL_EXTRACT"

[dialectic.levels.minimal.model_config.overrides]
base_url = "EXIST_OLLAMA_URL/v1"
api_key = "ollama"

[dialectic.levels.low.model_config]
