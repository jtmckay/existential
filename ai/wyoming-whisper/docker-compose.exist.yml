# Refs:
#   Upstream: https://github.com/OHF-Voice/wyoming-faster-whisper
#   Protocol: https://github.com/OHF-Voice/wyoming
#
# wyoming-whisper — speech-to-text for Home Assistant's Assist pipeline.
#
# Why this and not whisperx: HA's Assist pipeline speaks the Wyoming protocol
# (a line-oriented TCP protocol), not HTTP. WhisperX is a FastAPI service, so HA
# cannot drive it without a bridge — and the two do different jobs. WhisperX
# transcribes long recordings with speaker diarization (the auto-transcription
# quest); this handles short, latency-sensitive voice commands.
#
# Deliberately CPU-only. The GPU is already holding the chat model plus
# embeddings, and whisperx's large-v3 takes another ~3 GB when it runs. A GPU
# STT model here would make voice and chat evict each other.
#
# Services:
#   wyoming-whisper  — Wyoming STT server (TCP 10300)
#
# Volumes:
#   wyoming_whisper_cache — downloaded whisper models; re-downloadable.
#
# Access: tcp://wyoming-whisper:10300 on the exist network. No HTTP, so no Caddy
# block and no dashy tile — you add it in Home Assistant, not in a browser.
#
# Setup: Home Assistant → Settings → Devices & Services → Add Integration →
#        Wyoming Protocol → host `wyoming-whisper`, port `10300`.

services:
  wyoming-whisper:
    container_name: wyoming-whisper
    # 3.7.0: no CLI/behavior change we rely on (checked the changelog — the new
    # WYO_WHISPER_* env-var config, HA name-biasing tiers, and Dockerfile.gpu
    # are all inert for a CPU install with no --hass-token set), but ctranslate2
    # went 4.8.1 → 4.8.2, fixing an out-of-bounds StorageView read plus two
    # unvalidated-allocation-size bugs in the C++ inference engine that loads
    # the model and processes every request
    # (https://github.com/OpenNMT/CTranslate2/releases/tag/v4.8.2) — worth
    # taking for a service that runs untrusted-ish model files through it.
    # Re-tested end-to-end at this tag: model download (with the HF_HOME fix
    # below), describe handshake, and a real transcription all still work.
    image: rhasspy/wyoming-whisper:3.7.0
    restart: unless-stopped
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    networks:
      - exist
    environment:
      # The image has no passwd entry for uid 1000, so HOME resolves to "/" —
      # root-owned and unwritable. huggingface_hub's xet backend caches chunks
      # under $HOME/.cache regardless of --download-dir, so the model download
      # died with "Permission denied (os error 13)". Point HF at the one
      # writable path this container has: the mounted data volume.
      # Re-verified against the 3.7.0 image (still uid-1000-rootless, still
      # ships hf-xet 1.6.0, and `hf_hub_download(..., filename="model.bin")`
      # as uid 1000 with no HF_HOME still dies trying to write
      # /.cache/huggingface/xet/logs) — this is not stale.
      HF_HOME: /data
    # No ports published: Home Assistant reaches it over Docker DNS. Uncomment
    # only if HA runs on a different machine.
    #   ports:
    #     - "10300:10300"
    # --uri/--data-dir/--device need no restating: the image's own ENTRYPOINT
    # (docker_run.sh, verified at this exact tag) already runs
    # `wyoming_faster_whisper --uri tcp://0.0.0.0:10300 --data-dir /data
    # --device cpu "$@"` before appending this list — STT_DEVICE (the only
    # thing that would change the device default) is unset in this CPU image,
    # only Dockerfile.gpu sets it. --data-dir is also an argparse "append"
    # action, so restating it doesn't just shadow the default, it adds a
    # second, redundant /data to the search list. --download-dir needs nothing
    # either: unset, it falls back to the first --data-dir (__main__.py:224-226),
    # which is already /data from the entrypoint. --model/--language/--beam-size
    # are the only settings actually being chosen here.
    command:
      - --model
      - ${EXIST_MODEL_STT:-base}
      - --language
      - ${EXIST_MODEL_STT_LANGUAGE:-en}
      - --beam-size
      - "1"
    volumes:
      # Whisper models, downloaded on first use — a _cache, re-downloadable.
      - wyoming_whisper_cache:/data
    healthcheck:
      # Wyoming is raw TCP with no HTTP surface, and the image ships no curl.
      # Bash's /dev/tcp is the cheapest honest liveness check.
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/10300' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First start downloads the model before the socket opens.
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 1G

x-exist-volumes:
  wyoming_whisper_cache: {}

networks:
  exist:
    external: true
