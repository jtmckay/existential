services:
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:v0.11.3
    # Runs as root and stays root: the image is built with USER 0:0 and /app owned
    # by root, and start.sh has no UID/GID or gosu handling at all (verified in
    # v0.11.x). A `user:` override therefore cannot read /app/backend/open_webui/
    # static and the server 500s on every asset. Files under the data volume are
    # root-owned as a result — `./existential.sh run fix-permissions` if needed.
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 1G was the wall, not a ceiling — it idled at 1022 MiB against it.
          # The image bakes two in-process SentenceTransformers models for RAG
          # (all-MiniLM-L6-v2 plus a bge-micro auxiliary, see RAG_EMBEDDING_MODEL
          # in its own env), so the embedder is resident in this container rather
          # than served by ollama, and that is most of the footprint. Setting
          # RAG_EMBEDDING_ENGINE=ollama would move it out, but it re-embeds every
          # existing knowledge collection under a different model, so that is a
          # deliberate migration, not a memory fix.
          memory: 2G
    networks:
      - exist
    # ports disabled — access via https://open-webui.<domain> (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - "11488:8080"
    environment:
      WEBUI_ADMIN_NAME: ${OPEN_WEBUI_ADMIN_NAME}
      WEBUI_ADMIN_EMAIL: ${OPEN_WEBUI_ADMIN_EMAIL}
      WEBUI_ADMIN_PASSWORD: ${OPEN_WEBUI_ADMIN_PASSWORD}
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY}
      OPENAI_API_BASE_URLS: "http://hermes-agent:8642/v1"
      OPENAI_API_KEYS: "${OPEN_WEBUI_HERMES_API_KEY:-}"
      # Disable direct Ollama integration — hermes-agent is the primary backend
      ENABLE_OLLAMA_API: "false"
      # Seeded on first boot only (persisted config wins afterwards): the admin is
      # created from WEBUI_ADMIN_* above, so open signup would just hand a public
      # account — with every model behind it — to anyone who reaches the Caddy host.
      ENABLE_SIGNUP: "false"
      # Point STT at the WhisperX service (OpenAI-compatible /v1 endpoint) instead
      # of running a second STT instance. Voice input is single-speaker, so it uses
      # the plain transcription path — diarization is for the automations pipeline.
      # NOTE: whisperx is NOT part of Core, so on a Core-only install this endpoint
      # does not resolve and voice input errors out (text chat is unaffected).
      # Enable EXIST_IS_AI_WHISPERX to use it. wyoming-whisper, which Core does
      # ship, speaks the Wyoming protocol and cannot stand in here.
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_OPENAI_API_BASE_URL: http://whisperx:8000/v1
      AUDIO_STT_OPENAI_API_KEY: "none"
    # The image's default healthcheck fails during the all-MiniLM-L6-v2 embedding
    # model download (several minutes on first boot). Override with a long
    # start_period so the container stays "starting" (not "unhealthy") while
    # the model downloads. The interval/retries keep ticking once the grace
    # period expires; a running server answers /health quickly after that.
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    volumes:
      # SQLite (webui.db) + Chroma vector store — must be local; NFS breaks both.
      # TODO: no backup yet — add a volume-backup cron in
      # services/decree/decree-backup/cron.example/ (nothing else is needed).
      - open_webui_data:/app/backend/data

x-exist-volumes:
  open_webui_data: { db: true }

networks:
  exist:
    external: true
