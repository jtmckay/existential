# Refs:
#   gateway.ts in this folder; the fleet lib (automation/plugins/fleet.md)
#
# model-gateway — the controller's model endpoint: an OpenAI-compatible /v1 that
# leases whichever GPU host offers the model a call names. Turned on by
# `./existential.sh run fleet controller`; every host then sets
# EXIST_MODEL_URL=http://<controller>:4400/v1 and leaves EXIST_MODEL_KEY blank (the
# fleet secret is the key).

services:
  model-gateway:
    container_name: model-gateway
    image: existential/decree:local  # shared image, built by existential-adhoc
    pull_policy: never
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # node and a bash per call in flight, each holding its lease (~60 MiB idle).
    deploy:
      resources:
        limits:
          memory: 256M
    # The image's baked HEALTHCHECK is the decree daemon's.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4400/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    entrypoint: ["/opt/decree/node_modules/.bin/tsx", "/gateway.ts"]
    networks:
      - exist
    # On the network: every host's clients call it, and the hosts on your own network reach
    # this host's Loki through it (/loki/...). The fleet secret is its key.
    ports:
      - "${MODEL_GATEWAY_BIND:-0.0.0.0}:4400:4400"
    environment:
      - EXIST_FLEET_SECRET=${EXIST_FLEET_SECRET:-}
      # Where the offers are: this host's Loki (the controller's).
      - EXIST_FLEET_LOKI=${EXIST_FLEET_LOKI:-}
      - FLEET_HOLDER=gateway
      - FLEET_LIB=/fleet/fleet.md
      - FLEET_LOKI_UPSTREAM=http://loki:3100
    volumes:
      - ./gateway.ts:/gateway.ts:ro
      # The fleet lib from the repo's own plugin file, never the workspace's copy: anything
      # that can write the workspace (an automation, a synced device) would otherwise choose
      # what this runs and what /plugins/fleet_gpu.md hands out. The folder, so a pull reaches
      # it (git replaces a file, and a file mount keeps the old one). Never at /lib: that would
      # hide the image's own libraries, and nothing would start.
      - ../../automation/plugins:/fleet:ro
