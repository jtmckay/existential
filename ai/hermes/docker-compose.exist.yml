# Refs:
#   Agent: https://github.com/NousResearch/hermes-agent
#
# Hermes Agent — Docker Compose Setup
#
# Requirements:
#   - Docker & Docker Compose
#   - At least one LLM provider key in .env (ANTHROPIC_API_KEY,
#     OPENAI_API_KEY, OPENROUTER_API_KEY, GOOGLE_API_KEY, …) OR a
#     reachable local server (Ollama, LM Studio, etc.)
#
# Services:
#   hermes-agent     — AI agent gateway + dashboard (ports 48642, 49119)
#
# NFS-backed (via EXIST_NFS_*) — source-of-truth state:
#   hermes_agent_data     — agent config, sessions, skills, memory.
#
# Troubleshooting:
#   - Check logs: docker compose logs hermes-agent
#   - Agent must expose port 8642

services:
  # The Hermes Agent gateway + dashboard APIs.
  # Gateway runs in the foreground on :8642. Dashboard runs as a background
  # process on :9119 and is reachable only on the private Docker network.
  hermes-agent:
    container_name: hermes-agent
    image: nousresearch/hermes-agent:v2026.8.18
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    # entrypoint.sh installs decree (cargo) and claude-code (npm) into the
    # persistent data volume on first start, chowns them to HERMES_UID:HERMES_GID,
    # then chains to /init (s6-overlay) which remaps the user and starts the gateway.
    entrypoint: ["/entrypoint.sh"]
    # gateway run is the CMD passed through s6 → runs the long-running API server.
    # (The image's default interactive CLI exits immediately under `docker compose up -d`.)
    networks:
      - exist
    # ports disabled — access via https://hermes-agent.<domain> (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - "48642:8642"   # OpenAI-compatible API
    #     - "49119:9119"   # Web dashboard
    #     - "43827:43827"   # Spotify callback (temporary: requires binding to 0.0.0.0 manually - somehow)
    # No user: override. The image uses s6-overlay: init runs as root, the
    # cont-init remaps the internal "hermes" user to HERMES_UID:HERMES_GID,
    # chowns /opt/data to that uid, then s6-applyuidgid drops to that uid before
    # starting the gateway. Pinning user: here breaks s6-applyuidgid (needs
    # CAP_SETGID to call setgroups) and crashes the container before the gateway
    # ever starts. The gateway itself runs unprivileged as the host uid.
    environment:
      # Remap the internal hermes user to the host user so the gateway runs as
      # the host uid/gid and writes bind-mount files owned by the host user.
      # EXIST_PUID/EXIST_PGID are auto-detected from the host (default 1000).
      HERMES_UID: "${EXIST_PUID:-1000}"
      HERMES_GID: "${EXIST_PGID:-1000}"
      # Pass through whichever provider keys are set in .env. hermes-agent
      # uses the one that matches the provider configured in
      # ~/.hermes/config.yaml (or whatever `hermes setup` picked).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      HERMES_DASHBOARD: '1'
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: '9119'
      # HERMES_DASHBOARD_INSECURE is inert as of the v2026.8.18 image — it no
      # longer disables the auth gate. A non-loopback dashboard bind now requires
      # a real auth provider, so basic auth below is what actually lets :9119 come
      # up. Kept only to document that setting it is not a substitute.
      HERMES_DASHBOARD_INSECURE: '1'
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
      # HERMES_DASHBOARD_TUI: '1' # Enables chat through dashboard
      # Authentication for the gateway when exposing off-loopback.
      # In the default compose setup the gateway is reachable over the docker
      # network on hermes-agent:8642, so an empty key works for localhost-only
      # Docker installs. For any deployment that publishes 8642 on the host or a
      # LAN IP, set a strong HERMES_API_KEY in .env.shared. See #122.
      API_SERVER_KEY: ${HERMES_API_KEY}
      # Bind inside the container so other services can reach the gateway over
      # Docker DNS. The host publish below remains loopback-only.
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_ENABLED: true
      # Serve every named profile off this one listener, each under its own
      # URL prefix: /p/<profile>/v1/... The default profile keeps the bare
      # /v1/... path, and an unknown profile 404s. Without this the prefix is
      # silently ignored and every request lands on the default profile.
      # Set here rather than in config.yaml because config.yaml is the user's
      # file; the env var is the documented operator override (env > config).
      GATEWAY_MULTIPLEX_PROFILES: '1'
      # Honcho self-hosted memory — the honcho plugin's baseUrl fallback.
      # exist.initial.sh already activates the provider (honcho.json +
      # config.yaml memory.provider), so no manual setup step is needed.
      HONCHO_BASE_URL: "http://honcho:8000"
      # Read by entrypoint.sh when a profile's definition names openviking as an
      # MCP server — it is written into that profile's generated config.yaml.
      OPENVIKING_API_KEY: ${OPENVIKING_API_KEY:-}
    command: ["gateway", "run"]
    volumes:
      # entrypoint.sh: installs decree + claude-code on first start, chains to /init.
      - ./entrypoint.sh:/entrypoint.sh:ro
      # Profile definitions, read-only. Adding a profile is adding a directory
      # here; entrypoint.sh provisions each one into /opt/data/profiles on boot.
      - ./profiles:/opt/profile-defs:ro
      # Agent home (.hermes): config, credentials, session state, likely SQLite,
      # written by hermes-agent. Tier-2 local (never NFS).
      - hermes_agent_data:/opt/data
      # Repo top-level workspace, shadowing hermes_agent_data's own workspace/
      # subdir — shared with code-server's /workspace so both containers (and
      # Claude Code running inside hermes-agent) operate on the same files.
      - ../../workspace:/opt/data/workspace
      # Build tree cache: pre-populated by exist.initial.sh so stage2-hook.sh
      # finds .venv at uid 1000 and skips the 5-min chown on every restart.
      # Run ./existential.sh run before docker compose up -d on a fresh clone.
      - ./hermes_install/.venv:/opt/hermes/.venv
      - ./hermes_install/ui-tui:/opt/hermes/ui-tui
      - ./hermes_install/gateway:/opt/hermes/gateway
      - ./hermes_install/node_modules:/opt/hermes/node_modules
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8642/health && curl -fsS http://localhost:9119/api/status || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

x-exist-volumes:
  hermes_agent_data: { db: true }

networks:
  exist:
    external: true
