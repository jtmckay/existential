services:
  existential-adhoc:
    container_name: existential-adhoc
    build:
      context: ./services/automation/decree
    # Canonical build of the decree image. Tagged so the main decree daemon and
    # decree and decree-backup can reference it via `image:` instead of each
    # re-building decree/Dockerfile into its own per-project image.
    image: existential/decree:local
    pull_policy: never
    restart: "no"
    # adhoc runs ephemeral one-shots (--entrypoint ""), never the decree daemon,
    # so the image's daemon HEALTHCHECK (PID 1 == decree) never applies here.
    healthcheck:
      disable: true
    environment:
      - IN_CONTAINER=1
      - EXIST_VRAM_GB=${EXIST_VRAM_GB:-}
      - DECREE_DIR=/work/.decree
      - SECRETS_DIR=/secrets
      - NTFY_TOKEN=${EXIST_NTFY_TOKEN:-}
      - NTFY_URL=${EXIST_NTFY_URL:-}
    volumes:
      - ./automation:/work/.decree:z
      - ./automation/secrets:/secrets:z
      - ./src:/src:z
      - .:/repo:z

    networks:
      - exist
    tty: true
    stdin_open: true

networks:
  exist:
    driver: bridge
