services:
  # File share
  # UI interface at http://localhost:8421/
  nextcloud:
    container_name: nextcloud
    image: nextcloud:34.0.3
    restart: unless-stopped
    # Apache + mod_php, not php-fpm — this tag's CMD is apache2-foreground
    # (`docker inspect nextcloud:34.0.3 --format '{{.Config.Cmd}}'`); the -fpm
    # variant is a separate tag this compose doesn't use. ~120 MiB idle
    # (`docker stats`, fresh install, no uploads), but a large upload or occ
    # command is the real peak.
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - exist
    depends_on:
      # redis is a separate, independently-toggleable service (nas/redis) and
      # not declared here: an EXIST_IS_NAS_REDIS=false install would then merge
      # a depends_on for a service that doesn't exist in the compose file at
      # all, and `docker compose up` refuses the whole stack over it. redis is
      # still effectively required (REDIS_HOST below is unconditional, no
      # blank-key guard like the S3 vars) — exist.test.sh flags that
      # dependency instead, where a missing/disabled redis fails one check
      # rather than the render.
      nextcloud-db:
        condition: service_healthy
    healthcheck:
      # A 200 on /status.php is NOT proof of a working instance — an
      # *uninstalled* Nextcloud serves the setup wizard with the same 200 and
      # "installed":false (see exist.test.sh, which hits the same endpoint).
      # Check the JSON, not just the status code.
      test: ["CMD-SHELL", "curl -sf http://localhost/status.php | grep -q '\"installed\":true'"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Apache doesn't start listening until AFTER the entrypoint's install/
      # upgrade block finishes (rsync of the codebase + `occ maintenance:install`
      # + hooks), so a slow first boot fails silently within this window rather
      # than flapping the health state.
      start_period: 120s
    # ports disabled — access via https://nextcloud.<domain> (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - "48421:80"
    volumes:
      # The image declares VOLUME /var/www/html, so without an explicit mount here
      # Docker creates an ANONYMOUS volume for it — opaque, invisible to
      # `docker volume ls` hygiene, and discarded on some recreates. When it goes,
      # version.php goes with it: the entrypoint then reads installed_version as
      # 0.0.0.0, decides this is a new instance, and re-runs the install against a
      # config.php that says otherwise ("Command maintenance:install is not
      # defined"). Declare it so the webroot is ours and persists.
      - nextcloud_html_data:/var/www/html
      # The persisted subdirs nest inside it, so user data can be nfs: true while
      # the PHP code stays local — mounting all of /var/www/html over NFS makes
      # every request stat thousands of small files.
      - nextcloud_data:/var/www/html/data
      - nextcloud_config_data:/var/www/html/config
      - nextcloud_custom_apps_data:/var/www/html/custom_apps
      - nextcloud_themes_data:/var/www/html/themes
      - ./servername.conf:/etc/apache2/conf-enabled/servername.conf:ro,Z
      # Entrypoint hooks. Mounted at the post-installation folder specifically,
      # not over /docker-entrypoint-hooks.d, so the image's other hook folders
      # stay in place. Scripts here need the exec bit — run_path skips the rest.
      - ./hooks/post-installation:/docker-entrypoint-hooks.d/post-installation:ro,z
      # before-starting runs on EVERY start. NEXTCLOUD_TRUSTED_DOMAINS is the one
      # var here that actually needs that: the installer writes trusted_domains
      # into config.php once (image /entrypoint.sh's install block) and nothing
      # ever re-reads the env var after that, so
      # hooks/before-starting/01-sync-domain.sh re-applies it on every start —
      # that is what lets EXIST_DOMAIN change without nuking the volumes. See
      # that script for the rest.
      - ./hooks/before-starting:/docker-entrypoint-hooks.d/before-starting:ro,z
    environment:
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_DOMAIN:-nextcloud.$EXIST_DOMAIN}
      # TRUSTED_PROXIES/OVERWRITEHOST/OVERWRITEPROTOCOL/OVERWRITECLIURL are NOT
      # one-time like trusted_domains above: the installer also copies
      # config/reverse-proxy.config.php (image source) into the live config
      # dir, and that file calls getenv() on each of these directly — it is
      # merged back in on EVERY PHP request, after config.php and overriding it
      # (lib/private/Config.php's readData(): config.php loads first, then
      # every `*.config.php` via glob+natsort, later keys win via
      # array_replace_recursive). So these four just need to stay set here;
      # verified by restarting a live install with a changed OVERWRITEHOST and
      # no hook involved — `occ config:system:get overwritehost` picked up the
      # new value immediately while config.php's own baked copy stayed on the
      # old one.
      - TRUSTED_PROXIES=${NEXTCLOUD_TRUSTED_PROXIES}
      - OVERWRITEHOST=${NEXTCLOUD_DOMAIN:-nextcloud.$EXIST_DOMAIN}
      - OVERWRITECLIURL=${NEXTCLOUD_PROTOCOL}://${NEXTCLOUD_DOMAIN:-nextcloud.$EXIST_DOMAIN}
      - OVERWRITEPROTOCOL=${NEXTCLOUD_PROTOCOL}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - MYSQL_PASSWORD=${NEXTCLOUD_SQL_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${NEXTCLOUD_SQL_USER}
      - MYSQL_HOST=nextcloud-db
      - REDIS_HOST=redis
      # NOT REDIS_PORT — config/redis.config.php (image source) only reads
      # REDIS_HOST_PORT; REDIS_PORT was never consumed by anything and only
      # looked correct because 6379 is also what redis.config.php falls back to
      # when REDIS_HOST_PORT is absent (`getenv('REDIS_HOST')[0] != '/' ? 6379`).
      - REDIS_HOST_PORT=6379
      - REDIS_HOST_PASSWORD=${EXIST_REDIS_PASSWORD}
      # MinIO external storage, mounted at /S3 by
      # hooks/post-installation/01-minio-external-storage.sh. Blank key = the
      # hook no-ops, so this is safe on an install without minio.
      - NEXTCLOUD_S3_BUCKET=${NEXTCLOUD_S3_BUCKET:-}
      - NEXTCLOUD_S3_HOST=minio
      - NEXTCLOUD_S3_PORT=9000
      - NEXTCLOUD_S3_KEY=${NEXTCLOUD_S3_KEY:-}
      - NEXTCLOUD_S3_SECRET=${NEXTCLOUD_S3_SECRET:-}

  # Database for Nextcloud
  nextcloud-db:
    container_name: nextcloud-db
    image: mariadb:11.4
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    restart: unless-stopped
    # MariaDB. ~85 MiB idle measured via `docker stats` (default
    # innodb_buffer_pool_size is the stock 128M, i.e. about half this limit —
    # raise the limit before raising that). Grows with library size beyond that.
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - exist
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      # MariaDB — db: true. Backup: copy nextcloud-db-backup-{nightly,weekly}.md
      # from services/decree/decree-backup/cron.example/ into cron/ and restart it.
      - nextcloud_sql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${NEXTCLOUD_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${NEXTCLOUD_SQL_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${NEXTCLOUD_SQL_USER}
      # - MARIADB_AUTO_UPGRADE=1
    healthcheck:
      # healthcheck.sh ships in the official image and connects over the local
      # unix socket as the current OS user with no creds — verified working
      # under this same non-root `user:` against a correctly-owned bind mount
      # (`docker exec --user 1000:1000 <ctr> healthcheck.sh --connect` → 0).
      # innodb_initialized additionally rejects the narrow window mid-crash-
      # recovery where the socket answers but InnoDB isn't ready yet.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

x-exist-volumes:
  # The webroot itself: PHP code, always local (never nfs — see the mount comment).
  nextcloud_html_data: {}
  nextcloud_data: { nfs: true }
  nextcloud_config_data: { nfs: true }
  nextcloud_custom_apps_data: { nfs: true }
  nextcloud_themes_data: { nfs: true }
  nextcloud_sql_data: { db: true }

networks:
  exist:
    external: true
