services:
  redis:
    container_name: redis
    # Full version pin, not a floating major — this volume is db: true (below),
    # so a version bump is a data-format decision, same reasoning as the honcho
    # postgres pin.
    image: redis:8.10.1-alpine3.23
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    restart: unless-stopped
    # Nextcloud's memcache.distributed + memcache.locking backend and PHP session
    # store (nextcloud/docker 34/apache/config/redis.config.php sets both memcache
    # keys whenever REDIS_HOST is set; entrypoint.sh's configure_redis_session
    # wires the session handler). No maxmemory/eviction policy is set here, so
    # redis grows unbounded rather than evicting keys — this limit is what
    # finally stops it, via an OOM-kill/restart, not a graceful policy.
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - exist
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      # requirepass means a bare `redis-cli ping` gets NOAUTH, not PONG.
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - redis_data:/data:Z

x-exist-volumes:
  redis_data: { db: true }

networks:
  exist:
    external: true
