services:
  redis:
    container_name: redis
    image: redis:alpine
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    restart: unless-stopped
    # Nextcloud's file-lock and session cache. A cap matters — redis will fill what it is given.
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - exist
    command:
      - /bin/sh
      - -c
      - redis-server --requirepass ${REDIS_PASSWORD}
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data:Z

x-exist-volumes:
  redis_data: { db: true }

networks:
  exist:
    external: true
