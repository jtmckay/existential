services:
  # UI interface at http://localhost:9980/
  collabora:
    container_name: collabora
    image: collabora/code:26.04.3.1.1
    restart: unless-stopped
    networks:
      - exist
    environment:
      - username=${COLLABORA_USERNAME}
      - password=${COLLABORA_PASSWORD} 
      # Derived from EXIST_DOMAIN at container start; override per-service by
      # setting COLLABORA_NEXTCLOUD_DOMAIN / COLLABORA_DOMAIN in collabora's .env.
      - domain=${COLLABORA_NEXTCLOUD_DOMAIN:-nextcloud.$EXIST_DOMAIN}
      - server_name=${COLLABORA_DOMAIN:-collabora.$EXIST_DOMAIN}
      - dictionaries=en
      # - extra_params=--o:ssl.enable=true
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
    # ports disabled — access via https://collabora.<domain> (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - 9980:9980

networks:
  exist:
    external: true
