services:
  # S3-compatible object storage. Backs Nextcloud's /S3 external-storage mount
  # (nas/nextcloud) and the workspace-sync -> automation-webhook file-event pipeline
  # (automation/shared_routines/workspace-sync.sh). Console UI is reached via
  # https://minio.<domain> by default -- ports below are disabled, so
  # http://localhost:49001 only works once you uncomment them.
  minio:
    container_name: minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    restart: unless-stopped
    # Object store; ~63 MiB idle. Multipart uploads buffer in memory.
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - exist
    # ports disabled — access via https://minio.<domain> (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - "49000:9000"
    #     - "49001:9001"
    volumes:
      # TODO: no backup yet — add a volume-backup cron in
      # services/automation/backup/cron.example/ (nothing else is needed).
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_DOMAIN=${MINIO_DOMAIN}
      - MINIO_SERVER_URL=${MINIO_SERVER_URL}
      - MINIO_NOTIFY_WEBHOOK_ENABLE_DECREE=on
      # 8801 is automation-webhook's listen port and is not configurable --
      # see the comment on its environment: block. This pointed at 48880
      # for a while, which refuses connections, so no bucket event ever
      # reached decree. Nothing caught it: decree's own exist.test.sh
      # probes 8801 directly, so the webhook looked healthy from the one
      # side that was never wrong. src/test/e2e/e2e.sh now walks the real
      # chain (write object -> event -> inbox -> run) instead.
      - MINIO_NOTIFY_WEBHOOK_ENDPOINT_DECREE=http://automation-webhook:8801/minio
      - MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_DECREE=${MINIO_DECREE_WEBHOOK_AUTH_TOKEN}
    command: server /data --console-address :9001
    # /minio/health/live is registered unauthenticated (cmd/healthcheck-router.go)
    # and answers 200 as soon as the HTTP server accepts connections -- it does
    # NOT wait for the object layer to finish initializing (LivenessCheckHandler,
    # cmd/healthcheck-handler.go:192-211, only ever fails on a full request queue).
    # That is still the right liveness signal (same tier docker-compose healthchecks
    # use everywhere else in this stack); exist.test.sh's mc probe below is what
    # proves the object layer + credentials actually work.
    # curl is a static binary baked into the image (Dockerfile.release), not a
    # package -- present on every minio/minio:RELEASE.* tag.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

x-exist-volumes:
  minio_data: { nfs: true }

networks:
  exist:
    external: true
