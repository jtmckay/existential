services:
  # Object storage for Nextcloud
  # UI interface at http://localhost:49001
  minio:
    container_name: minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    restart: unless-stopped
    # Object store; ~63 MiB idle. Multipart uploads buffer in memory.
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - exist
    # ports disabled — access via https://minio.<domain> (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - "49000:9000"
    #     - "49001:9001"
    volumes:
      - minio_data:/data # Path to the mounted NFS share on the Proxmox host
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_DOMAIN=${MINIO_DOMAIN}
      - MINIO_SERVER_URL=${MINIO_SERVER_URL}
      - MINIO_NOTIFY_WEBHOOK_ENABLE_DECREE=on
      # 8801 is decree-webhook's listen port and is not configurable --
      # see the comment on its environment: block. This pointed at 48880
      # for a while, which refuses connections, so no bucket event ever
      # reached decree. Nothing caught it: decree's own exist.test.sh
      # probes 8801 directly, so the webhook looked healthy from the one
      # side that was never wrong. src/test/e2e/e2e.sh now walks the real
      # chain (write object -> event -> inbox -> run) instead.
      - MINIO_NOTIFY_WEBHOOK_ENDPOINT_DECREE=http://decree-webhook:8801/minio
      - MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_DECREE=${MINIO_DECREE_WEBHOOK_AUTH_TOKEN}
    command: server /data --console-address :9001

  minio-decree:
    container_name: minio-decree
    image: existential/decree:local  # shared image, built by existential-adhoc
    pull_policy: never
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    restart: unless-stopped
    # Sidecar: bash, mc and rclone — the workspace sync runs here.
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - exist
    environment:
      - DECREE_DAEMON=true
      - DECREE_SIDECAR=true
      - DECREE_INTERVAL=2
      - IN_CONTAINER=1
      - EXIST_BACKUP_RCLONE_REMOTE=${EXIST_BACKUP_RCLONE_REMOTE}
      # Bucket creation (minio-bucket routine) talks to the S3 API as root, and
      # minio-service-account needs root on the admin API to mint the identity below.
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      # The scoped identity nextcloud authenticates with (minio-service-account routine).
      - MINIO_NEXTCLOUD_ACCESS_KEY=${MINIO_NEXTCLOUD_ACCESS_KEY}
      - MINIO_NEXTCLOUD_SECRET_KEY=${MINIO_NEXTCLOUD_SECRET_KEY}
    volumes:
      - ./decree:/work/.decree:z
      - ./exist.test.sh:/work/exist.test.sh:ro,z
      - ../../src/test/exist-test.sh:/src/test/exist-test.sh:ro,z
      - ../../automations/shared_routines:/work/.decree/shared_routines:ro,z
      - ../../automations/lib:/work/.decree/lib:ro,z
      - ../../automations/runs:/work/.decree/runs:z
      - ../../automations/secrets:/secrets:ro,z
      # The workspace, read-only: workspace-sync only ever reads it to
      # mirror into the bucket. Writes come from the decree container.
      - ../../workspace:/workspace:ro,z
    tty: false

x-exist-volumes:
  minio_data: { nfs: true }

networks:
  exist:
    external: true
