name: router
description: Ask the chat model which department fits a task, then hand it to agent_task in that department.
data:
  source_file: { type: string, default: "" }
  output_name: { type: string, default: "" }
initial: route
states:
  route:
    invoke: router
    transitions: { done: done, not_routed: not_routed }
    emits: [agent_task]
  done: { final: true }
  # No department matched, or the model gave no answer. Never guessed; the
  # reason is in the run's log.
  not_routed: { final: true }
  failed: { final: true }
