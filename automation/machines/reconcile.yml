name: reconcile
description: An automation spec in notes/automations/ was accepted, edited or deleted; file it as its migration for develop, re-run it when it changed, or remove what it built.
data:
  path: { type: string, default: "" }
  change: { type: string, default: "" }
initial: reconcile
states:
  reconcile:
    invoke: reconcile
    transitions: { done: done }
    emits: [develop, notify]
  done: { final: true }
  failed: { final: true }
