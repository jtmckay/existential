name: homeassistant_voice
description: Wire Wyoming speech-to-text and text-to-speech, and the chat model as the conversation agent, into Home Assistant's Assist pipeline.
initial: wait_for_homeassistant
states:
  # First boot runs this before homeassistant has finished starting.
  wait_for_homeassistant:
    invoke:
      script: { name: wait_for_homeassistant, timeout: 10m }
    transitions: { done: homeassistant_voice }
  homeassistant_voice:
    invoke: homeassistant_voice
    transitions: { done: done }
  done: { final: true }
  failed: { final: true }
