# What is on, for every decree project: automation/plugins.yml is yours, copied
# from this once. ./existential.sh flow (and run plugin on|off) edit it. Each
# plugin's project: says which daemon runs it (automation, backup, host), and
# what it needs comes with it. Everything else is off until you turn it on.
# automation/plugins/ has every plugin.
on:
  - note-to-automation
  - clean-runs
  - health-checks
  - pi
# false: a plugin whose file changed is named on ./existential.sh, not installed.
auto_update: true
