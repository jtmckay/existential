services:
  # Grafana dashboards at http://localhost:43010
  grafana:
    container_name: grafana
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    # ~300 MiB measured idle on 13.2 (11.x sat at ~110 MiB).
    deploy:
      resources:
        limits:
          memory: 640M
    # grafana runs as uid 472 internally; run as the host user instead so it can
    # write the host-owned bind-mounted grafana_data (declared db: true — never NFS).
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    # grafana/grafana:13.2.1 ships wget and answers /api/health with the
    # database status (verified against the running container). Without this the
    # container had no health signal at all, from the image or from here.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - exist
    # ports disabled — access via https://grafana.<domain> (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - 43010:3000
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Usage stats to stats.grafana.org. The update check (version only) stays.
      - GF_ANALYTICS_REPORTING_ENABLED=false
      # provisioning/alerting/decree.yaml posts failed decree runs to ntfy.
      - NTFY_URL=${EXIST_NTFY_URL:-http://ntfy:80}
      - NTFY_USER=${EXIST_NTFY_USER:-}
      - NTFY_PASSWORD=${EXIST_NTFY_PASSWORD:-}
    volumes:
      # SQLite (grafana.db) — must be local; NFS breaks WAL locking.
      # TODO: no backup yet — add a volume-backup cron in
      # services/automation/backup/cron.example/ (nothing else is needed).
      - grafana_data:/var/lib/grafana
      # Mount the subdirs we own, not the parent: mounting
      # /etc/grafana/provisioning wholesale hides the image's empty plugins/,
      # notifiers/ and access-control/ dirs, and grafana logs a
      # level=error for each missing one on every boot.
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./provisioning/alerting:/etc/grafana/provisioning/alerting:ro

x-exist-volumes:
  grafana_data: { db: true }
