services:
  uptime-kuma:
    container_name: uptime-kuma
    image: "louislam/uptime-kuma:2.5.3"
    restart: unless-stopped
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    # Measured: 118 MiB idle under this limit, no swap pressure (node sizes its
    # heap to the cgroup). Monitor count is what moves it.
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - exist
    # ports disabled — access via https://uptime-kuma.<domain> (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - 43001:3001
    environment:
      # v2 shows an interactive DB-choice wizard on first boot unless this is set.
      - UPTIME_KUMA_DB_TYPE=sqlite
    volumes:
      # SQLite — must be local; NFS breaks WAL locking.
      - uptime_kuma_data:/app/data

x-exist-volumes:
  uptime_kuma_data: { db: true }

networks:
  exist:
    external: true
