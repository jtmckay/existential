services:
  # UI interface at http://localhost:30565
  uptime-kuma:
    container_name: uptime-kuma
    image: "louislam/uptime-kuma:2.5.0"
    restart: unless-stopped
    # SQLite-backed prober. Memory tracks monitor count, which is small here.
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - exist
    # ports disabled — access via https://uptime-kuma.<domain> (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - 43001:3001
    environment:
      - ADMIN_USERNAME=${UPTIME_KUMA_ADMIN_USERNAME}
      - ADMIN_PASSWORD=${UPTIME_KUMA_ADMIN_PASSWORD}
    volumes:
      # SQLite — must be local; NFS breaks WAL locking.
      # TODO: no backup yet — add a volume-backup cron in
      # services/decree/decree-backup/cron.example/ (nothing else is needed).
      - uptime_kuma_data:/app/data

x-exist-volumes:
  uptime_kuma_data: { db: true }

networks:
  exist:
    external: true
