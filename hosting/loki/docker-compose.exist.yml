services:
  loki:
    container_name: loki
    image: grafana/loki:3.2.0
    restart: unless-stopped
    # ~120 MiB measured, including loki-config.yaml's 100 MB embedded results
    # cache. A wide Grafana time range costs more; that spill goes to swap, which
    # is the right trade for a query you run occasionally.
    deploy:
      resources:
        limits:
          memory: 384M
    # loki runs as uid 10001 internally; run as the host user instead so it can
    # write the host-owned bind-mounted loki_data (declared db: true — never NFS).
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    networks:
      - exist
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      # boltdb-shipper index + chunks — must be local; NFS locking is unreliable.
      # TODO: no backup yet — add an opt-in volume-backup cron in
      # services/decree/decree-backup/cron.example/ (nothing else is needed).
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  loki-promtail:
    container_name: loki-promtail
    image: grafana/promtail:3.2.0
    restart: unless-stopped
    # Tails decree's run logs and ships them. Steady ~50-80 MB.
    deploy:
      resources:
        limits:
          memory: 192M
    networks:
      - exist
    volumes:
      - ./loki-promtail-config.yaml:/etc/promtail/config.yml:ro
      - ../../automations/runs:/runs:ro
      # promtail scrapes the on-disk json logs directly (static_configs in
      # loki-promtail-config.yaml) — there is no docker_sd_configs, so the
      # daemon socket is not needed. Mounting /var/run/docker.sock would grant
      # promtail full Docker API access (= host root), so it is deliberately
      # omitted.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

x-exist-volumes:
  loki_data: { db: true }

networks:
  exist:
    external: true
