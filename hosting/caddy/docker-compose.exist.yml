services:
  caddy:
    container_name: caddy
    image: caddy:2.11.4
    restart: unless-stopped
    # Reverse proxy; ~24 MiB idle. Grows only with concurrent TLS handshakes.
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - exist
        # ipv4_address: 10.0.0.5 # Verify by running `docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' caddy`
    # Least privilege: Caddy only needs to bind 80/443, not full host privilege.
    cap_add:
      - NET_BIND_SERVICE
    # The admin API answers on loopback only (verified: caddy binds 127.0.0.1:2019),
    # so this is a real liveness probe that needs no backend to be up. Without a
    # healthcheck a wedged caddy reads as "running" to the container-state gate,
    # which only ever looks for `unhealthy`.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      # :443 is HTTPS; :80 redirects http→https (and serves the Let's Encrypt
      # challenge when EXIST_PUBLIC_DOMAIN is set). Keep both.
      - "80:80"
      - "443:443"
      # Caddy serves HTTP/3 on udp/443 and advertises it via Alt-Svc on every
      # response; without this mapping every browser tries QUIC, times out, and
      # falls back to TCP on each new connection.
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - ./error.html:/var/www/html/error.html:ro,Z
      # Internal CA root + ACME state — plain files, but worth keeping.
      # TODO: no backup yet — add a volume-backup cron in
      # services/decree/decree-backup/cron.example/ (nothing else is needed).
      - caddy_data:/data
      # Autosaved JSON config, rebuilt from the Caddyfile on every start.
      - caddy_config_cache:/config
      # TLS certs: the stable *.<domain> pair minted by exist.initial.sh, plus any
      # cert you drop in yourself (public.pem / cloudflare.pem). Nothing here is
      # tracked — exist.initial.sh creates the dir.
      - ./certs/:/etc/caddy/certs/:ro,Z
    environment:
      # Resolved at container start from the stack-wide EXIST_DOMAIN, so changing
      # the domain needs no re-render. Set CADDY_DOMAIN in caddy's .env to override
      # for this service only. The Caddyfile reads it as {$CADDY_DOMAIN}.
      # PEER/PUBLIC are only used by the front-door swap-in Caddyfiles.
      - CADDY_DOMAIN=${CADDY_DOMAIN:-$EXIST_DOMAIN}
      # Where ollama.<domain> actually points. Follows the stack-wide
      # endpoint, so the hostname resolves to a remote ollama under
      # EXIST_GPU_VENDOR=external and to the local container otherwise --
      # which turns ollama.<domain> into a live check of whether the
      # configured endpoint is reachable, instead of a guaranteed 502.
      - CADDY_OLLAMA_UPSTREAM=${EXIST_OLLAMA_URL:-http://ollama:11434}
      # Firecrawl has no auth of its own (see the firecrawl block in the
      # Caddyfile) -- caddy is where the bearer key is enforced. Blank when
      # firecrawl is disabled, which fails that host closed.
      - CADDY_FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - EXIST_PEER_HOST_IP=${EXIST_PEER_HOST_IP}
      - EXIST_PUBLIC_DOMAIN=${EXIST_PUBLIC_DOMAIN}

x-exist-volumes:
  caddy_data: {}
  caddy_config_cache: {}

networks:
  exist:
    external: true
