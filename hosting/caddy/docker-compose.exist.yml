services:
  caddy:
    container_name: caddy
    image: caddy:2.11.4
    restart: unless-stopped
    # Reverse proxy; ~24 MiB idle. Grows only with concurrent TLS handshakes.
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - exist
        # ipv4_address: 10.0.0.5 # Verify by running `docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' caddy`
    # Least privilege: Caddy only needs to bind 80/443, not full host privilege.
    cap_add:
      - NET_BIND_SERVICE
    ports:
      # :443 is HTTPS; :80 redirects http→https (and serves the Let's Encrypt
      # challenge when EXIST_PUBLIC_DOMAIN is set). Keep both.
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - ./error.html:/var/www/html/error.html:ro,Z
      # Internal CA root + ACME state — db: true, worth keeping.
      # TODO: backup sidecar → volumes/caddy_data_backup (no sidecar yet).
      - caddy_data:/data
      # Autosaved JSON config (regenerated from the Caddyfile) — a _cache throwaway.
      - caddy_config_data:/config
      # TLS certs: the stable *.<domain> pair minted by exist.initial.sh and any
      # user-supplied cloudflare origin pair. Only *.exist.pem templates are tracked.
      - ./certs/:/etc/caddy/certs/:ro,Z
    environment:
      - CADDY_INGRESS_NETWORKS=exist
      # Resolved at container start from the stack-wide EXIST_DOMAIN, so changing
      # the domain needs no re-render. Set CADDY_DOMAIN in caddy's .env to override
      # for this service only. The Caddyfile reads it as {$CADDY_DOMAIN}.
      # PEER/PUBLIC are only used by the front-door swap-in Caddyfiles.
      - CADDY_DOMAIN=${CADDY_DOMAIN:-$EXIST_DOMAIN}
      # Where ollama.<domain> actually points. Follows the stack-wide
      # endpoint, so the hostname resolves to a remote ollama under
      # EXIST_GPU_VENDOR=external and to the local container otherwise --
      # which turns ollama.<domain> into a live check of whether the
      # configured endpoint is reachable, instead of a guaranteed 502.
      - CADDY_OLLAMA_UPSTREAM=${EXIST_OLLAMA_URL:-http://ollama:11434}
      - EXIST_PEER_HOST_IP=${EXIST_PEER_HOST_IP}
      - EXIST_PUBLIC_DOMAIN=${EXIST_PUBLIC_DOMAIN}

x-exist-volumes:
  caddy_data: {}
  caddy_config_data: {}

networks:
  exist:
    external: true
