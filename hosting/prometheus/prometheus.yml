global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ['prometheus-pushgateway:9091']

  - job_name: node
    static_configs:
      - targets: ['prometheus-node-exporter:9100']

  # decree_runs_total and decree_run_duration_milliseconds, derived by alloy
  # from each decree run's events.jsonl (hosting/loki/loki-alloy-config.alloy).
  - job_name: decree
    static_configs:
      - targets: ['loki-alloy:12345']
