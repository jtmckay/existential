groups:
  - name: existential
    rules:
      # ── Host resources ────────────────────────────────────────────────────
      - alert: HostDiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host disk space low (< 15% free)"
          description: "Root filesystem has {{ $value | humanizePercentage }} free."

      - alert: HostDiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Host disk space critical (< 5% free)"
          description: "Root filesystem has {{ $value | humanizePercentage }} free."

      - alert: HostMemoryHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage above 90%"
          description: "Host memory is {{ $value | humanizePercentage }} used."

      - alert: HostCpuHigh
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU usage above 90% for 10 minutes"
          description: "CPU is {{ $value | humanize }}% used."

      # ── Service health (via decree triage) ───────────────────────────────
      - alert: ServiceHealthCheckFailing
        expr: exist_service_healthy == 0
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.service }} is failing its own exist.test.sh"
          description: "Triage has reported {{ $labels.service }} ({{ $labels.category }}) unhealthy for 20 minutes. Check Loki for recent run logs."

      # ── Backup health (via alloy's decree_runs_total) ─────────────────────
      # alloy derives decree_runs_total{machine, state} from each run's
      # events.jsonl (hosting/loki/loki-alloy-config.alloy). Every backup
      # machine runs nightly, so a 48h window with no successful run is a
      # stopped backup. `and ... offset 48h` holds it off until the series is
      # 48h old: a fresh install's first run is a flat 1, not an increase.
      - alert: BackupNotRun
        expr: |
          increase(decree_runs_total{machine=~"db_backup|volume_backup|sqlite_backup", state="done"}[48h]) == 0
            and decree_runs_total{machine=~"db_backup|volume_backup|sqlite_backup", state="done"} offset 48h
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Backup machine {{ $labels.machine }} has not succeeded in 48h"
          description: "No run of {{ $labels.machine }} ended in done for 48h. `docker exec automation-backup decree status` lists its recent runs."
