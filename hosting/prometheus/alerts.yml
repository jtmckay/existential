groups:
  - name: existential
    rules:
      # ── Host resources ────────────────────────────────────────────────────
      - alert: HostDiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host disk space low (< 15% free)"
          description: "Root filesystem has {{ $value | humanizePercentage }} free."

      - alert: HostDiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Host disk space critical (< 5% free)"
          description: "Root filesystem has {{ $value | humanizePercentage }} free."

      - alert: HostMemoryHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage above 90%"
          description: "Host memory is {{ $value | humanizePercentage }} used."

      - alert: HostCpuHigh
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU usage above 90% for 10 minutes"
          description: "CPU is {{ $value | humanize }}% used."

      # ── Service health (via decree triage) ───────────────────────────────
      - alert: ServiceHealthCheckFailing
        expr: exist_service_healthy == 0
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.service }} is failing its own exist.test.sh"
          description: "Triage has reported {{ $labels.service }} ({{ $labels.category }}) unhealthy for 20 minutes. Check Loki for recent run logs."

      # ── Backup health (via pushgateway) ───────────────────────────────────
      # Instance label is the decree routine name (automation/lib/hooks/afterEach.sh
      # pushes every routine run to job=decree/instance=<routine>, and Pushgateway
      # auto-derives push_time_seconds per job/instance grouping key — verified
      # empirically, no metric named push_time_seconds is emitted by the routines
      # themselves). Covers all three backup routines in
      # automation/shared_routines/: volume-backup, db-backup, sqlite-backup.
      # workspace-sync is deliberately excluded — it mirrors workspace/ into
      # MinIO to drive S3 events, not a backup (see the routine's own header).
      - alert: BackupNotRun
        expr: (time() - push_time_seconds{instance=~"db-backup|volume-backup|sqlite-backup"}) > 86400 * 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Backup job {{ $labels.instance }} has not reported in 48h"
          description: "Last seen {{ $value | humanizeDuration }} ago. Check decree cron config."
