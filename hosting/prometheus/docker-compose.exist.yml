services:
  # Prometheus metrics UI at https://prometheus.<domain> (no host port by default)
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    # ~145 MiB measured. The TSDB head holds ~2h of samples, so RAM tracks active
    # series (3 scrape jobs at 15s), not the 90d retention in the flags below —
    # that is disk.
    deploy:
      resources:
        limits:
          memory: 512M
    # prometheus runs as uid 65534 (nobody) internally; run as the host user
    # instead so it can write the host-owned bind-mounted prometheus_data
    # (declared db: true — never NFS).
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    networks:
      - exist
    # /-/healthy only proves the web server answers, not that scraping/rules
    # are working (exist.test.sh's `up` query covers that) — still a real
    # liveness signal without it a wedged process reads as "running" to the
    # container-state gate. wget is busybox's, baked into the image (verified:
    # /bin/wget in prom/prometheus:v3.14.0, no curl).
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # ports disabled — access via https://prometheus.<domain> (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - 49090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      # TSDB — must be local; mmap + POSIX locks are unsupported on NFS (corruption).
      # TODO: no backup yet — add an opt-in backup cron in
      # services/decree/decree-backup/cron.example/ (prometheus has a snapshot API).
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      # Whichever limit trips first wins. Without the size cap 90d of retention is
      # unbounded on disk, and this stack's disk is shared with every volume.
      - '--storage.tsdb.retention.size=5GB'

  prometheus-pushgateway:
    container_name: prometheus-pushgateway
    image: prom/pushgateway:v1.11.3
    restart: unless-stopped
    # Holds pushed metrics in memory only; tiny unless something pushes a flood.
    deploy:
      resources:
        limits:
          memory: 64M
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    networks:
      - exist
    # Same /bin/wget-on-busybox baseline as prometheus above (verified against
    # prom/pushgateway:v1.11.3).
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9091/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus-node-exporter:
    container_name: prometheus-node-exporter
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    # Reads /proc on scrape. ~20 MB and flat.
    deploy:
      resources:
        limits:
          memory: 64M
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    networks:
      - exist
    # node-exporter serves no /-/healthy (verified: 404 — it registers no such
    # route); /metrics is the liveness signal, same one exist.test.sh probes.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Host PID namespace so the /proc entries under /host/proc resolve to host
    # processes rather than this container's one. Network metrics still report
    # this container's netns (eth0/lo) — host NICs would need network_mode: host,
    # which would take it off the exist bridge and out of Docker DNS.
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

x-exist-volumes:
  prometheus_data: { db: true }

networks:
  exist:
    external: true
