services:
  # decree-go-rest in front of this host's own decree project (the repo's .decree), on the
  # LAN at :8801 behind the fleet secret: how other hosts ask a GPU box for its card. It
  # runs no work and can write nothing but .decree/inbox/; lease_gpu, in this host's decree
  # daemon, does the leasing. Turned on by `./existential.sh run fleet api`.
  fleet-api:
    container_name: fleet-api
    # Bundles decree v0.6.0 (no 0.6.1 release): the newest decree-go-rest, not DECREE_TAG.
    image: ghcr.io/jtmckay/decree-go-rest:0.6.0
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    restart: unless-stopped
    # Covers the 10 s it gives requests in flight.
    stop_grace_period: 15s
    # Static Go binary, plus a decree process per request; ~10 MiB idle.
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - exist
    # On the network: every host's fleet lib asks it. Plain HTTP; the bearer secret is the key.
    ports:
      - "${FLEET_API_BIND:-0.0.0.0}:8801:8801"
    environment:
      - EXIST_FLEET_SECRET=${EXIST_FLEET_SECRET:-}
    volumes:
      # The host's decree project: its endpoints (.decree/decree-go-rest.yml, from the host
      # plugins on) read-only, and the inbox the host daemon works.
      - ../../.decree:/project/.decree:ro,z
      - ../../.decree/inbox:/project/.decree/inbox:z
    healthcheck:
      # -config too: without it -healthcheck looks for ./decree-go-rest.yml.
      test: ["CMD", "decree-go-rest", "-config", "/project/.decree/decree-go-rest.yml", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
