routine_source: /work/.decree/shared_routines
# decree requires both, and this daemon deliberately has no way to reach a
# model: nothing here reasons, and it holds every volume and every credential.
# /bin/false is the honest value — it fails loudly instead of naming a CLI that
# was never installed. The gateway-backed version lives in the other daemon's
# config.
commands:
  ai_router: /bin/false
  ai_interactive: /bin/false
max_attempts: 3
max_log_size: 2097152
# Without this decree falls back to its own built-in default, which names a
# routine this repo does not have. route-failed logs what arrived and stops —
# the same catch-all the other daemon uses, and it calls nothing.
default_routine: route-failed
hooks:
  beforeAll: ""
  afterAll: ""
  beforeEach: /work/.decree/lib/hooks/config-watch.sh
  afterEach: /work/.decree/lib/hooks/afterEach.sh
  onDeadLetter: /work/.decree/lib/hooks/onDeadLetter.sh
# Not backups-only, despite the container name: this daemon sees every volume
# and every credential, so anything that needs THAT (bulk volumes/, master
# .env) lands here — but nothing that reasons, routes, or reaches an AI does;
# that stays in `decree` even if it touches the same data. workspace-sync
# below is the standing example: not a backup, kept here for the credentials
# and mount, not the purpose.
shared_routines:
  # The catch-all named by default_routine above: unlisted, decree would decline
  # it and an unrouted message would dead-letter with no explanation.
  route-failed:
    enabled: true
  volume-backup:
    enabled: true
  db-backup:
    enabled: true
  sqlite-backup:
    enabled: true
  workspace-sync:
    enabled: true
  # Opt-in — needs a real external source (NOTES_PULL_SOURCE) before it
  # does anything useful. Not in Core's copies list for the same reason.
  notes-pull:
    enabled: false
  notify:
    enabled: true
  # Triage lives here, not in `automation`, so the container that runs AI agents
  # does not need the repo mounted — and with it the master .env, .env.shared and
  # the Caddy CA private key. Triage is the reason that mount existed.
  #
  # It belongs here on the daemon's own terms: it observes and reports, it does
  # no reasoning, no routing and makes no AI call. What it needs is exactly what
  # this daemon is for — bulk read access to the repo and the credentials each
  # service's exist.test.sh authenticates with.
  #
  # On by default, and it quiets itself as the stack stays green — see the
  # routine's header. The person who most needs triage is the one who does not
  # know it exists, so it cannot be opt-in.
  triage:
    enabled: true
  clean-runs:
    enabled: true
