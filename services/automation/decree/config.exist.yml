routine_source: /work/.decree/shared_routines
commands:
  ai_router: opencode run {prompt}
  ai_interactive: opencode
max_attempts: 3
max_depth: 100
max_log_size: 2097152
# The catch-all, not develop. A message that arrives with no routine and no
# router to pick one gets logged and dropped rather than handed to develop,
# which would put an unrouted message in front of an agent with terminal and
# write_file access.
default_routine: route-failed
hooks:
  beforeAll: ""
  afterAll: ""
  beforeEach: /work/.decree/lib/hooks/config-watch.sh
  afterEach: /work/.decree/lib/hooks/afterEach.sh
  onDeadLetter: /work/.decree/lib/hooks/onDeadLetter.sh
shared_routines:
  actual-budget:
    enabled: false
  actual-budget-parse:
    enabled: false
  check-disabled-runs:
    enabled: true
  clean-runs:
    enabled: true
  comfy:
    enabled: false
  develop:
    enabled: false
  agent-task:
    enabled: false
  # Reads the registry via `decree routine` and writes it to workspace/ai/ —
  # hermes has no mount into automation/, so this is how it learns what's
  # runnable. Needs no credentials and touches nothing but its own output
  # file, so it's safe on by default like check-versions/service-health.
  routines-snapshot:
    enabled: true
  # Routing: hermes-router picks a department and queues hermes-dept for it.
  # route-failed is the catch-all and is on by default — it is what decree
  # falls back to, so disabling it would strand unroutable messages.
  # There is one hermes-dept for every department: which one is a message
  # parameter, and the departments themselves are ai/hermes/profiles/*/.
  hermes-router:
    enabled: false
  route-failed:
    enabled: true
  hermes-dept:
    enabled: false
  file-processor:
    enabled: true
  s3-router:
    enabled: true
  nextcloud-richdocuments:
    enabled: true
  nextcloud-rclone-remote:
    enabled: true
  nextcloud-calendar:
    enabled: true
  homeassistant-onboarding:
    enabled: true
  homeassistant-wyoming-hermes:
    enabled: true
  # Named by cron.example/calendar-extract.md — same reasoning as
  # openviking-index-dir above: unlisted, the cron fires and decree declines
  # the routine while looking perfectly healthy.
  calendar-extract:
    enabled: true
  gmail:
    enabled: false
  gmail-sync:
    enabled: false
  # Named by cron.example/openviking-index-knowledgebase.md. Activating a cron
  # is meant to be the whole job, so the routine it names has to be visible —
  # unlisted, the cron fires and decree declines the routine, and openviking
  # indexes nothing while looking perfectly healthy.
  openviking-index-dir:
    enabled: true
  # Same shape: telegram-ingest and telegram-receipt are named by their
  # cron.example files (and 05-smart-home / auto-receipt-split copy the receipt
  # one), and telegram-notify is chained from actual-budget's outbox. All three
  # are gated by the cron file and /secrets/telegram/credentials.env, so leaving
  # them visible costs nothing and being invisible silently drops the work.
  telegram-ingest:
    enabled: true
  telegram-receipt:
    enabled: true
  telegram-notify:
    enabled: true
  notes:
    enabled: false
  note-triage:
    enabled: false
  note-develop:
    enabled: false
  # The fan-out alternative to note-develop: hands the flagged idea to the
  # research and sales departments, so hermes-dept must be on for it to land.
  idea-workup:
    enabled: false
  # A different question than note-triage: not "is this worth acting on" but
  # "does anything you already know connect to this". Calls the research
  # hermes profile directly for its OpenViking access, so hermes and
  # openviking must both be enabled for it to find anything. On by default
  # like notify/triage below: harmless with no cron file present. Core's
  # `copies:` block is what actually turns it on, by dropping
  # note-connect.md into automation/cron/ — delete that file to opt out.
  note-connect:
    enabled: true
  notify:
    enabled: true
  # Reference example — named by cron.example/rss-poll.md. Polls a feed,
  # filters deterministically, and chains into notify (or any routine) via
  # fwd_ params.
  rss-poll:
    enabled: false
  # On by default, and it quiets itself as the stack stays green — see the
  # routine's header. The person who most needs triage is the one who does not
  # know it exists, so it cannot be opt-in.
  triage:
    enabled: true
  # No cron names these three: they run only when a MIGRATION does. Left
  # disabled/unlisted they made every ollama migration a no-op --
  # decree created the run, declined the routine, and `decree process` stopped
  # at that first dead letter, hiding every migration behind it.
  ollama-pull:
    enabled: true
  check-versions:
    enabled: true
  service-health:
    enabled: true
