services:
  automation:
    container_name: automation
    image: existential/decree:local  # shared image, built by existential-adhoc
    pull_policy: never
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    restart: unless-stopped
    # The automation daemon. ~45 MiB idle, but it runs opencode and tsx in-process.
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - exist
    environment:
      - DECREE_AI=${AUTOMATION_AI}
      - DECREE_DAEMON=true
      # triage runs every service test in here; hermes reads this to know
      # whether a real inference is affordable on this host.
      - EXIST_VRAM_GB=${EXIST_VRAM_GB:-}
      # whisperx-transcribe.ts must send device/compute_type on every request —
      # whisperx's async endpoints default to cuda/float16 regardless of the
      # service's own env — so it needs the same vendor answer generate-compose uses.
      - EXIST_GPU_VENDOR=${EXIST_GPU_VENDOR:-}
      - DECREE_INTERVAL=2
      - NTFY_TOKEN=${EXIST_NTFY_TOKEN}
      - NTFY_URL=${EXIST_NTFY_URL}
      # ntfy denies every publish by default, so notify.sh needs a credential.
      # These are created by ntfy's own entrypoint — nothing to run by hand.
      - NTFY_USER=${EXIST_NTFY_USER:-}
      - NTFY_PASSWORD=${EXIST_NTFY_PASSWORD:-}
      - TELEGRAM_BOT_TOKEN=${EXIST_TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${EXIST_TELEGRAM_CHAT_ID:-}
      - DECREE_NOTES_DIR=${AUTOMATION_NOTES_DIR}
      - DROPBOX_DEST_DIR=${AUTOMATION_DROPBOX_DEST_DIR}
      # Gateway credentials for routines that need a model (note-triage,
      # note-develop). Empty when hermes/firecrawl are disabled — those
      # routines are opt-in and their pre-checks report the gap clearly.
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - IN_CONTAINER=1
      # OpenCode (agent-task) writes its state under $HOME. The container runs
      # under an unprivileged uid with no home directory, and OpenCode fails
      # without one — /data is the writable path it already has.
      - HOME=/data
      - OPENCODE_DISABLE_AUTOUPDATE=1
      # Image work (image-ocr, telegram-receipt) is the VISION role, so it
      # follows that endpoint and falls back to the global one when it is blank.
      # See the "Model Endpoints" block in .env.exist.shared.
      - OLLAMA_URL=${EXIST_OLLAMA_URL_VISION:-${EXIST_OLLAMA_URL:-http://ollama:11434}}
      #- GMAIL_INITIAL_SYNC_DAYS=7
      #- GMAIL_LABEL_FILTER=INBOX
      # ── Service migrations and service crons ────────────────────────────
      # These used to live in per-service *-decree sidecars. They reach their
      # service over the exist bridge, so they only ever needed credentials,
      # never a volume — which is why they collapse into this daemon and the
      # backups (which do need volumes) went to decree-backup instead.
      # Enumerated rather than env_file: this container runs agent-task with
      # terminal and write access, so it gets exactly the keys it uses.
      #
      # minio-bucket talks to the S3 API as root; minio-service-account needs
      # root on the admin API to mint the scoped nextcloud identity.
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-}
      - MINIO_NEXTCLOUD_ACCESS_KEY=${MINIO_NEXTCLOUD_ACCESS_KEY:-}
      - MINIO_NEXTCLOUD_SECRET_KEY=${MINIO_NEXTCLOUD_SECRET_KEY:-}
      # nextcloud-richdocuments talks to Nextcloud's own OCS/provisioning API as
      # admin (no docker socket here, so `occ` is not reachable — see the
      # routine for the exact endpoints, verified against nextcloud:34.0.3).
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:-}
      - COLLABORA_URL=https://${COLLABORA_DOMAIN:-collabora.$EXIST_DOMAIN}
      # openviking-index-dir authenticates to the OpenViking REST API.
      - OPENVIKING_API_KEY=${OPENVIKING_API_KEY:-}
      # The fallback for any role with no endpoint of its own.
      - EXIST_OLLAMA_URL=${EXIST_OLLAMA_URL:-http://ollama:11434}
      # Model globals from .env.shared — the ollama-pull routine resolves its
      # OLLAMA_ROLE against these, so a migration names a role, not a tag.
      # See the "Model Selection" block in .env.exist.shared.
      - EXIST_MODEL_CHAT=${EXIST_MODEL_CHAT}
      - EXIST_MODEL_CHAT_NUM_CTX=${EXIST_MODEL_CHAT_NUM_CTX}
      - EXIST_MODEL_EXTRACT=${EXIST_MODEL_EXTRACT}
      - EXIST_MODEL_EMBED=${EXIST_MODEL_EMBED}
      - EXIST_MODEL_VISION=${EXIST_MODEL_VISION:-}
      # ...and the per-role endpoints, so a role is pulled to the machine that
      # will actually serve it. Blank means "wherever EXIST_OLLAMA_URL points".
      # See the "Model Endpoints" block in .env.exist.shared.
      - EXIST_OLLAMA_URL_CHAT=${EXIST_OLLAMA_URL_CHAT:-}
      - EXIST_OLLAMA_URL_EXTRACT=${EXIST_OLLAMA_URL_EXTRACT:-}
      - EXIST_OLLAMA_URL_EMBED=${EXIST_OLLAMA_URL_EMBED:-}
      - EXIST_OLLAMA_URL_VISION=${EXIST_OLLAMA_URL_VISION:-}
    volumes:
      # The whole root automation/ dir, wholesale — runs, secrets, cron,
      # migrations, inbox, outbox, processed.md, router.md. This IS
      # /work/.decree; everything below is a read-only overlay on top of it,
      # not a separate piece of content.
      - ../../automation:/work/.decree:z
      # This container runs agent-task with terminal and write access, so the
      # routine scripts and their config must not be writable from inside a
      # routine — a compromised or misbehaving run could otherwise rewrite the
      # code that every future run (and automation-backup) executes.
      - ../../automation/shared_routines:/work/.decree/shared_routines:ro,z
      - ../../automation/lib:/work/.decree/lib:ro,z
      # cron/, migrations/, and router.md are only ever written from the host
      # (a human/quest copying from automation-examples/, or exist.initial.sh)
      # before the container starts — nothing in shared_routines/ or the decree
      # binary itself writes to them at runtime, so they get the same
      # read-only treatment.
      - ../../automation/cron:/work/.decree/cron:ro,z
      - ../../automation/migrations:/work/.decree/migrations:ro,z
      - ../../automation/router.md:/work/.decree/router.md:ro,z
      # config.exist.yml/config.yml stay in services/automation/decree/ (not the
      # root) because the render pipeline and validate-conventions.ts both look
      # specifically for <slug>/decree/config.exist.yml — moving it to the root
      # would silently stop it from ever being rendered or validated. Layered
      # on top of the wholesale mount above, same pattern as opencode.json below.
      - ./decree/config.yml:/work/.decree/config.yml:ro,z
      # Also mounted at the conventional /secrets path — SECRETS_DIR=/secrets
      # is relied on directly by precheck.sh and friends.
      - ../../automation/secrets:/secrets:z
      # Notes data — a _cache. Subdirs created on first use by the scripts.
      #   /data/notes   — Nextcloud sync cache (source of truth: Nextcloud)
      #   /data/dropbox — compiled output for Dropbox (source of truth: /data/notes)
      - decree_data:/data:z
      - ../../docker-compose.yml:/work/.decree/docker-compose.yml:ro,z
      # The repo, read-only, so triage can run each enabled service's own
      # exist.test.sh — they live with their services, not in this directory.
      # Read-only on purpose: triage observes, it never repairs.
      - ../../:/repo:ro
      # The shared workspace, read-write: agent-task files its output in
      # workspace/ai/. This is the only container that writes there.
      - ../../workspace:/workspace:z
      # OpenCode pointed at hermes, so agent-task inherits hermes' MCP
      # servers (openviking, firecrawl, playwright) with no wiring here.
      - ./opencode.json:/work/opencode.json:ro,z
      # entrypoint.sh gates `decree process` (migrations) on /work/exist.test.sh
      # passing. This daemon's migrations target OTHER services, so the gate is
      # not its own exist.test.sh but a probe of every service it migrates —
      # skipping the ones that are disabled. See migration-gate.sh.
      - ./migration-gate.sh:/work/exist.test.sh:ro,z
    tty: false

  automation-backup:
    container_name: automation-backup
    image: existential/decree:local  # shared image, built by existential-adhoc
    pull_policy: never
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    restart: unless-stopped
    # Backup daemon: tar, pg_dump/mysqldump/mongodump, rclone. Idle between crons.
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - exist
    # The master env, deliberately. db-backup reads a different credential pair
    # per service, so enumerating them here would reintroduce exactly the
    # per-service wiring this container exists to delete. The trade is real and
    # bounded: this daemon runs six fixed backup routines, no agent and no
    # router, and the master env stays out of `decree`, which does run agents.
    env_file:
      - ../../.env
    environment:
      - DECREE_DAEMON=true
      # Marks THIS daemon, not `decree`, as the one with no /repo and no routing
      # stack: exist.test.sh skips its flag lookup and Caddy probes here only.
      - DECREE_BACKUP=true
      - DECREE_INTERVAL=2
      - IN_CONTAINER=1
      # Blanked on purpose, and this is why env_file needs watching: .env sets
      # DECREE_AI=opencode for the main daemon, and the entrypoint would npm-i
      # an AI CLI into a container that runs tar and rclone. Nothing here reasons.
      - DECREE_AI=
    volumes:
      - ./backup:/work/.decree:z
      - ../../automation/shared_routines:/work/.decree/shared_routines:ro,z
      - ../../automation/lib:/work/.decree/lib:ro,z
      - ../../automation/runs:/work/.decree/runs:z
      - ../../automation/secrets:/secrets:ro,z
      # Every volume at once. This is what makes a new service need no backup
      # wiring at all: its volumes/<name> dir is visible here the moment
      # generate-compose creates it, so activating a cron file is the whole job.
      # Read-WRITE, and only because restore needs it: the backup routines
      # themselves only ever read (tar, dump), but `./existential.sh run
      # backup-restore` extracts into these paths from this container.
      - ../../volumes:/volumes:z
      # workspace-sync mirrors the workspace into the MinIO bucket; it only reads.
      - ../../workspace:/workspace:ro
    # No /work/exist.test.sh mount: this daemon owns no migrations, so the
    # entrypoint's health-wait branch is correctly skipped.
    tty: false

  automation-webhook:
    container_name: automation-webhook
    # Self-contained static Go binary (webhook/main.go) on distroless. It no
    # longer rides existential/decree:local, so it carries none of that image's
    # npm tree and can be run anywhere — including the front-door host.
    # Built by compose, not by existential-adhoc (which only builds the shared
    # decree image).
    build:
      context: ./webhook
      dockerfile: Dockerfile
    image: existential/decree-webhook:local
    # Built by compose (above), never published anywhere — `docker compose pull`
    # doesn't look at `build:`, it just pulls whatever `image:` names for every
    # service, so without this it tries Docker Hub for a repo that only exists
    # as this local build and fails with "pull access denied". Same reason the
    # automation/automation-backup services above pin this.
    pull_policy: never
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    restart: unless-stopped
    # Static Go binary on distroless; ~9 MiB idle and flat.
    deploy:
      resources:
        limits:
          memory: 64M
    depends_on:
      - automation
    networks:
      - exist
    # ports disabled — access via https://automation-webhook.<domain> (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - "8801:8801"
    environment:
      # Listen port is not configurable: the container is reached only over the
      # exist bridge, so the binary's own default (8801) governs and caddy's
      # Caddyfile hardcodes the same value. DECREE_WEBHOOK_PORT still works as a
      # manual override if you uncomment ports: above — change both places.
      - DECREE_WEBHOOK_INBOX=/inbox
      #- DECREE_WEBHOOK_MAX_BODY_BYTES=262144
      #- DECREE_WEBHOOK_RATE_WINDOW_MS=60000
      #- DECREE_WEBHOOK_RATE_MAX=60
      #- DECREE_WEBHOOK_RATE_FAIL_MAX=10
    volumes:
      - ../../automation/inbox:/inbox:z
      - ./webhook/config.yml:/app/config.yml:ro
    healthcheck:
      # distroless ships neither curl nor wget — the binary probes itself
      test: ["CMD", "/webhook", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3

x-exist-volumes:
  decree_data: {}

networks:
  exist:
    external: true
