services:
  automation:
    container_name: automation
    image: existential/decree:local  # shared image, built by existential-adhoc
    pull_policy: never
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    # The decree image is debian-based and ships setuid binaries (su, mount,
    # passwd). Its /etc/passwd is world-writable so entrypoint.sh can add an
    # entry for the runtime uid — see decree/Dockerfile. Without this, those
    # two facts combine into container root, which is uid 0 against every
    # bind mount. This neuters every setuid binary regardless of /etc/passwd.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # The automation daemon. ~45 MiB idle, but it runs tsx in-process.
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - exist
    # Nothing here may start DECREE_: decree strips every inherited DECREE_*
    # variable before it runs a script.
    environment:
      # triage runs every service test in here; hermes reads this to know
      # whether a real inference is affordable on this host.
      - EXIST_VRAM_GB=${EXIST_VRAM_GB:-}
      # whisperx-transcribe.ts must send device/compute_type on every request —
      # whisperx's async endpoints default to cuda/float16 regardless of the
      # service's own env — so it needs the same vendor answer generate-compose uses.
      - EXIST_GPU_VENDOR=${EXIST_GPU_VENDOR:-}
      - NTFY_TOKEN=${EXIST_NTFY_TOKEN}
      - NTFY_URL=${EXIST_NTFY_URL}
      # ntfy denies every publish by default, so notify.sh needs a credential.
      # These are created by ntfy's own entrypoint — nothing to run by hand.
      - NTFY_USER=${EXIST_NTFY_USER:-}
      - NTFY_PASSWORD=${EXIST_NTFY_PASSWORD:-}
      - TELEGRAM_BOT_TOKEN=${EXIST_TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${EXIST_TELEGRAM_CHAT_ID:-}
      - NOTES_REMOTE_DIR=${AUTOMATION_NOTES_DIR}
      - DROPBOX_DEST_DIR=${AUTOMATION_DROPBOX_DEST_DIR}
      # Gateway credentials for routines that need a model (note-triage,
      # note-develop). Empty when hermes/firecrawl are disabled — those
      # routines are opt-in and their pre-checks report the gap clearly.
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      # Redraw workspace/.decree/graph/ whenever a machine changes (entrypoint.sh).
      - GRAPH_WATCH=1
      - IN_CONTAINER=1
      # The image's HOME (/home/decree) is the container's throwaway layer, so
      # anything written there is lost on recreate — including rclone's config,
      # which the nextcloud-rclone-remote migration writes once and every
      # rclone_src download then depends on. /data is the decree_data volume:
      # the writable path this container already has that survives a restart.
      - HOME=/data
      #- GMAIL_INITIAL_SYNC_DAYS=7
      #- GMAIL_LABEL_FILTER=INBOX
      # ── Service migrations and service crons ────────────────────────────
      # These used to live in per-service *-decree sidecars. They reach their
      # service over the exist bridge, so they only ever needed credentials,
      # never a volume — which is why they collapse into this daemon and the
      # backups (which do need volumes) went to decree-backup instead.
      # Enumerated rather than env_file: this container reasons and reaches
      # service APIs, so it gets exactly the keys it uses.
      #
      # nextcloud-richdocuments talks to Nextcloud's own OCS/provisioning API as
      # admin (no docker socket here, so `occ` is not reachable — see the
      # routine for the exact endpoints, verified against nextcloud:34.0.3).
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:-}
      # nextcloud_file_events registers Nextcloud's webhooks with this as their
      # bearer token — the same secret automation-webhook's /files route checks.
      - FILES_WEBHOOK_TOKEN=${EXIST_DECREE_FILES_WEBHOOK_AUTH_TOKEN:-}
      - COLLABORA_URL=https://${COLLABORA_DOMAIN:-collabora.$EXIST_DOMAIN}
      # homeassistant-onboarding creates the admin account through HA's own
      # onboarding API (no docker socket here, so entrypoint's job of patching
      # .storage stays there — this is a separate, network-reachable step).
      - HOMEASSISTANT_ADMIN_USER=${HOMEASSISTANT_ADMIN_USER:-}
      - HOMEASSISTANT_ADMIN_PASSWORD=${HOMEASSISTANT_ADMIN_PASSWORD:-}
      # openviking-index-dir authenticates to the OpenViking REST API.
      - OPENVIKING_API_KEY=${OPENVIKING_API_KEY:-}
      # Model globals from .env.shared. lib/model.sh resolves a role against
      # these, so a script or migration names a role, never a tag or a host.
      # See the "Model Selection" block in .env.exist.shared.
      - EXIST_MODEL_CHAT=${EXIST_MODEL_CHAT}
      - EXIST_MODEL_CHAT_NUM_CTX=${EXIST_MODEL_CHAT_NUM_CTX}
      - EXIST_MODEL_EXTRACT=${EXIST_MODEL_EXTRACT}
      - EXIST_MODEL_EMBED=${EXIST_MODEL_EMBED}
      - EXIST_MODEL_VISION=${EXIST_MODEL_VISION:-}
      # ...and the per-role endpoints. Blank means "wherever EXIST_MODEL_URL
      # points" — see the "Model Endpoints" block in .env.exist.shared.
      - EXIST_MODEL_URL=${EXIST_MODEL_URL:-http://ollama:11434/v1}
      - EXIST_MODEL_URL_CHAT=${EXIST_MODEL_URL_CHAT:-}
      - EXIST_MODEL_URL_EXTRACT=${EXIST_MODEL_URL_EXTRACT:-}
      - EXIST_MODEL_URL_EMBED=${EXIST_MODEL_URL_EMBED:-}
      - EXIST_MODEL_URL_VISION=${EXIST_MODEL_URL_VISION:-}
      # ollama_pull and the health checks touch ollama's own API only when it runs.
      - EXIST_IS_AI_OLLAMA=${EXIST_IS_AI_OLLAMA:-false}
      # Where the comfy routine POSTs its workflows — the local container by
      # default, another machine's ComfyUI when EXIST_COMFYUI_URL says so.
      - EXIST_COMFYUI_URL=${EXIST_COMFYUI_URL:-http://comfyui:8188}
    volumes:
      # workspace/.decree IS the project: machines, scripts, cron, migrations
      # and inbox the user (or an agent they direct) writes there run on the
      # next tick. exist.initial.sh seeds it from automation/ once per file.
      - workspace_data/.decree:/work/.decree:z
      # lib/ stays the repo's, read-only, so it follows the checkout.
      - ../../automation/lib:/work/.decree/lib:ro,z
      # Config, never secrets, and outside the synced workspace (decree reads
      # .decree/.env). exist.initial.sh creates it.
      - ../../automation/.env:/work/.decree/.env:ro,z
      # Secrets stay out of workspace/, at the conventional /secrets path.
      - ../../automation/secrets:/secrets:z
      # Notes data — a _cache. Subdirs created on first use by the scripts.
      #   /data/notes   — Nextcloud sync cache (source of truth: Nextcloud)
      #   /data/dropbox — compiled output for Dropbox (source of truth: /data/notes)
      - decree_data:/data:z
      # Outside .decree, so the generated compose never lands in workspace/.
      - ../../docker-compose.yml:/work/docker-compose.yml:ro,z
      # NOT the whole repo. This container hands prompts to hermes, so what it
      # can read is what a prompt injection can read. The whole-repo
      # mount that used to be here existed for triage, and carried the master
      # .env (every DB password and admin credential), .env.shared, and
      # hosting/caddy/certs/internal-ca-key.pem — the key that signs every
      # *.<domain> cert, i.e. a ready-made interception primitive.
      #
      # Triage moved to automation-backup, which does no reasoning and runs no
      # agent, and the mount went with it. All that is left here is what
      # hermes_router actually reads: the profile definitions, which hold no
      # secrets. Keep it that way — if something here starts wanting /repo,
      # mount the subtree it needs, not the root.
      - ../../ai/hermes/profiles:/repo/ai/hermes/profiles:ro
      # The shared workspace, read-write: agent_task files its output in
      # workspace/ai/. Writes here fire no file events (only uploads through
      # Nextcloud do), which is what keeps an agent's own output from
      # triggering another run.
      - workspace_data:/workspace:z
    tty: false

  automation-backup:
    container_name: automation-backup
    image: existential/decree:local  # shared image, built by existential-adhoc
    pull_policy: never
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    # The decree image is debian-based and ships setuid binaries (su, mount,
    # passwd). Its /etc/passwd is world-writable so entrypoint.sh can add an
    # entry for the runtime uid — see decree/Dockerfile. Without this, those
    # two facts combine into container root, which is uid 0 against every
    # bind mount. This neuters every setuid binary regardless of /etc/passwd.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Backup daemon: tar, pg_dump/mysqldump/mongodump, rclone. Idle between crons.
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - exist
    # The master env, deliberately. db_backup reads a different credential pair
    # per service, so enumerating them here would reintroduce exactly the
    # per-service wiring this container exists to delete. The trade is real and
    # bounded: this daemon runs a fixed set of machines, no agent and no router,
    # and the master env stays out of `automation`, which does run agents.
    env_file:
      - ../../.env
    environment:
      # This daemon's own machines just need "is the service up" — they cannot
      # reach the routing stack the way a full check does. Triage also runs here
      # and explicitly clears this per test, because it DOES want the full check.
      - EXIST_TEST_LIVENESS_ONLY=true
      - IN_CONTAINER=1
      # Same six as the daemon above: triage reports through notify. env_file
      # brings in the master .env, but notify.sh reads these unprefixed.
      - NTFY_TOKEN=${EXIST_NTFY_TOKEN}
      - NTFY_URL=${EXIST_NTFY_URL}
      - NTFY_USER=${EXIST_NTFY_USER:-}
      - NTFY_PASSWORD=${EXIST_NTFY_PASSWORD:-}
      - TELEGRAM_BOT_TOKEN=${EXIST_TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${EXIST_TELEGRAM_CHAT_ID:-}
    volumes:
      # Its own decree project — own machines/, cron/, runs/ and inbox/ — with
      # the scripts and lib/ shared, read-only, from automation/.
      - ./backup:/work/.decree:z
      - ./backup/machines:/work/.decree/machines:ro,z
      - ../../automation/scripts:/work/.decree/scripts:ro,z
      - ../../automation/lib:/work/.decree/lib:ro,z
      - ../../automation/secrets:/secrets:ro,z
      # Every volume at once. This is what makes a new service need no backup
      # wiring at all: its volumes/<name> dir is visible here the moment
      # generate-compose creates it, so activating a cron file is the whole job.
      # Read-WRITE, and only because restore needs it: the backup scripts
      # themselves only ever read (tar, dump), but `./existential.sh run
      # backup-restore` extracts into these paths from this container.
      - ../../volumes:/volumes:z
      # notes_pull rsyncs an external vault into workspace/notes/.
      - workspace_data:/workspace:z
      # Triage's backoff state and status report live at /data/triage — the same
      # volume `automation` mounts for /data/notes and /data/dropbox. Disjoint
      # subtrees, one volume.
      - decree_data:/data:z
      # The repo, read-only, so triage can run each enabled service's own
      # exist.test.sh — they live with their services, not in this directory —
      # and read .env.shared to know which services are enabled. Read-only on
      # purpose: triage observes, it never repairs.
      #
      # This is the credential-heaviest mount in the stack, which is why it is
      # here rather than in `automation`: this daemon runs a fixed set of
      # machines, no agent and no router, so nothing here interprets untrusted
      # input.
      - ../../:/repo:ro
    tty: false

  # decree-go-rest: authenticated POSTs become `decree emit` messages in
  # automation's inbox. Endpoints are workspace/.decree/decree-go-rest.yml (seeded —
  # it names environment variables, never secrets). It runs no work and can
  # write nothing but inbox/; the `automation` daemon runs what it queues.
  automation-webhook:
    container_name: automation-webhook
    # Bundles decree 0.5.0-beta.13 — keep it equal to decree/Dockerfile's tag.
    image: ghcr.io/jtmckay/decree-go-rest:0.5.0
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    restart: unless-stopped
    # Covers the 10 s it gives requests in flight.
    stop_grace_period: 15s
    # Static Go binary, plus a decree process per request; ~10 MiB idle.
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - automation
    networks:
      - exist
    # ports disabled — access via https://automation-webhook.<domain> (Caddy + pihole required)
    environment:
      # The default bearer secret, and the one Nextcloud's file events carry.
      - DECREE_GO_REST_SECRET=${AUTOMATION_WEBHOOK_SECRET}
      - FILES_WEBHOOK_TOKEN=${EXIST_DECREE_FILES_WEBHOOK_AUTH_TOKEN}
      # hermes' own, for its /hermes/* endpoints.
      - HERMES_WEBHOOK_SECRET=${EXIST_HERMES_WEBHOOK_TOKEN}
      # GET /openapi.json, which Lowcoder (or anything) reads as a data source.
      - DECREE_GO_REST_OPENAPI=true
    volumes:
      - workspace_data/.decree:/project/.decree:ro,z
      - workspace_data/.decree/inbox:/project/.decree/inbox:z
    healthcheck:
      # -config too: without it -healthcheck looks for ./decree-go-rest.yml.
      test: ["CMD", "decree-go-rest", "-config", "/project/.decree/decree-go-rest.yml", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3

x-exist-volumes:
  decree_data: {}
  # The user's workspace, shared with nextcloud (which serves it to the desktop
  # client), code-server and decree. Declared identically everywhere it is mounted.
  workspace_data: {}

networks:
  exist:
    external: true
