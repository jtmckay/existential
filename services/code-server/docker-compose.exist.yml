# Refs:
#   code-server: https://github.com/coder/code-server
#
# code-server — VS Code in the browser, backed by the decree base image.
#
# Services:
#   code-server   — VS Code web IDE (port 8080)
#
# Volumes:
#   workspace (repo top-level) — primary working directory, shared with
#   hermes-agent (see ai/hermes/docker-compose.exist.yml) so both see the same tree.

services:
  code-server:
    container_name: code-server
    image: existential/decree:local  # shared image, built by existential-adhoc
    pull_policy: never
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    # The decree image is debian-based and ships setuid binaries (su, mount,
    # passwd). Its /etc/passwd is world-writable so entrypoint.sh can add an
    # entry for the runtime uid — see decree/Dockerfile. Without this, those
    # two facts combine into container root, which is uid 0 against every
    # bind mount. This neuters every setuid binary regardless of /etc/passwd.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Measured against this image (v4.135.0): a fresh install (code-server
    # binary extraction, 4 extensions) peaks around 850MB under a 1G cgroup limit — mostly reclaimable page
    # cache, since actual RSS across both node processes is ~200MB once the
    # kernel is under pressure to reclaim it, and it settles under 300MB idle
    # with no client connected. But nothing here bounds an actual editing
    # session: each extension's language server (eslint, tsserver via the
    # bundled TS support, gitlens) is its own process, and this container also
    # runs whatever the integrated terminal launches — an agent CLI you
    # installed yourself, a build. 1G leaves those no headroom at all on top of
    # the idle baseline, so size for the realistic-use case, not the idle one.
    deploy:
      resources:
        limits:
          memory: 2G
    # The image's baked HEALTHCHECK (automation/Dockerfile) is
    # `grep -q decree /proc/1/comm`, written for the decree daemons where PID 1
    # execs `decree daemon`. This entrypoint execs code-server instead, whose
    # PID 1 /proc/1/comm is `MainThread` (verified: `docker exec code-server
    # cat /proc/1/comm`) — the baked check can never match and the container
    # sits "unhealthy" forever. /healthz is unauthenticated (verified: returns
    # 200 with no cookie/password, unlike / which 302s to /login) and answers
    # as soon as the HTTP server is listening, so it doesn't need code-server's
    # own auth wired through a healthcheck.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First boot installs the code-server binary and 4 extensions before
      # anything binds :8080 — measured ~70s on a fast connection when it also
      # npm-installed two CLIs; generous for a slow one.
      start_period: 180s
    entrypoint: ["/entrypoint.sh"]
    networks:
      - exist
    # ports disabled — access via https://code-server.<domain> (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - "42080:8080"
    environment:
      - IN_CONTAINER=1
      - PASSWORD=${CODE_SERVER_PASSWORD}
      # What the `hermes` command in the terminal authenticates with. Empty when
      # hermes is disabled — the CLI then says so instead of failing obscurely.
      - HERMES_API_KEY=${HERMES_API_KEY:-}
    volumes:
      - ./entrypoint.sh:/entrypoint.sh:ro
      # The `hermes` command entrypoint.sh puts on PATH, and the request shape it
      # sources. Tracked config, read-only, and the same two files the decree
      # daemons run — so the editor's terminal and a routine reach the gateway
      # through one implementation instead of two.
      - ../../automation/lib/hermes-cli.sh:/opt/hermes/hermes-cli.sh:ro
      - ../../automation/lib/hermes.sh:/opt/hermes/hermes.sh:ro
      # code-server's standalone install + extensions (reinstallable — just
      # slow) AND, since entrypoint.sh symlinks $HOME's dotfiles here, whatever
      # you `npm i -g` in the terminal plus its login state — not just a
      # disposable cache, hence the _data suffix. Not backed up: worst case is
      # reinstalling those and logging back in.
      - code_server_data:/code-server-data
      # Repo top-level workspace — shared with hermes-agent's /opt/data/workspace
      # so both containers operate on the same files.
      - ../../workspace:/workspace

x-exist-volumes:
  code_server_data: {}

networks:
  exist:
    external: true
