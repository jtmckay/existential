services:
  actual-budget:
    container_name: actual-budget
    image: actualbudget/actual-server:26.8.1
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    restart: unless-stopped
    # Node budgeting server with a SQLite file.
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - exist
    # ports disabled — access via https://actual-budget.<domain> (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - '45006:5006'
    volumes:
      # SQLite budget files + sync server — db: true (NFS breaks WAL locking).
      - actual_budget_data:/data
    environment:
      - ACTUAL_BUDGET_PASSWORD=${ACTUAL_BUDGET_PASSWORD}
    #   - ACTUAL_BUDGET_HTTPS_KEY=/data/key.key # Uncomment and provide path if using HTTPS
    #   - ACTUAL_BUDGET_HTTPS_CERT=/data/cert.crt # Uncomment and provide path if using HTTPS

x-exist-volumes:
  actual_budget_data: { db: true }

networks:
  exist:
    external: true
