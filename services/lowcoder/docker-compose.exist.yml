# https://github.com/lowcoder-org/lowcoder/blob/main/deploy/docker/docker-compose-multi.yaml
services:
  ##
  ## Start services required for Lowcoder (MongoDB and Redis)
  ##
  lowcoder-mongodb:
    container_name: lowcoder-mongodb
    image: "mongo:7.0"
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    restart: unless-stopped
    # MongoDB maps its working set into memory.
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      MONGO_INITDB_DATABASE: lowcoder
      MONGO_INITDB_ROOT_USERNAME: ${LOWCODER_MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${LOWCODER_MONGO_ROOT_PASSWORD}
    volumes:
      # MongoDB — db: true (NFS corrupts WiredTiger).
      # TODO: mongodump → volumes/lowcoder_mongo_backup (not wired up yet).
      - lowcoder_mongo_data:/data/db
      # mongo declares VOLUME for BOTH /data/db and /data/configdb. Mounting only
      # the first leaves Docker to make an anonymous volume for the second.
      - lowcoder_mongo_config_data:/data/configdb
    healthcheck: # https://github.com/rodrigobdz/docker-compose-healthchecks?tab=readme-ov-file#mongo
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "127.0.0.1/test",
          "--eval",
          "'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'",
        ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - exist

  lowcoder-redis:
    container_name: lowcoder-redis
    image: redis:7-alpine
    platform: linux/amd64 # Forces the x86 version (use linux/arm64 if you are on ARM but pulling x86)
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    # Disable RDB persistence — Redis is a session/query cache here, not a
    # primary store. Mounting /data host-owned below is what makes that safe:
    # redis:7-alpine declares VOLUME /data (redis:alpine, on 8.x, does not), so
    # without the mount Docker supplies an anonymous volume owned by the image's
    # built-in redis uid, which the host user cannot write.
    command: ["redis-server", "--save", ""]
    volumes:
      - lowcoder_redis_cache:/data
    restart: unless-stopped
    # Session store.
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck: # https://stackoverflow.com/a/71504657
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 10
    networks:
      - exist

  ##
  ## Start Lowcoder backend services (api-service and node-service)
  ##
  lowcoder-api-service:
    container_name: lowcoder-api-service
    image: lowcoderorg/lowcoder-ce-api-service:2.7.6
    restart: unless-stopped
    # JVM. Give the heap somewhere to live or it is OOM-killed under load.
    deploy:
      resources:
        limits:
          memory: 1G
    # Enabled ports to be able to access backend from host
    # ports:
    #   - "8080:8080"
    environment:
      LOWCODER_PUBLIC_URL: "https://lowcoder.${EXIST_DOMAIN}"
      LOWCODER_PUID: "${EXIST_PUID:-1000}"
      LOWCODER_PGID: "${EXIST_PGID:-1000}"
      LOWCODER_MONGODB_URL: "mongodb://${LOWCODER_MONGO_ROOT_USERNAME}:${LOWCODER_MONGO_ROOT_PASSWORD}@lowcoder-mongodb/lowcoder?authSource=admin"
      LOWCODER_REDIS_URL: "redis://lowcoder-redis:6379"
      LOWCODER_NODE_SERVICE_URL: "http://lowcoder-node-service:6060"
      LOWCODER_MAX_QUERY_TIMEOUT: 120
      LOWCODER_MAX_REQUEST_SIZE: 20m
      LOWCODER_EMAIL_AUTH_ENABLED: "true"
      LOWCODER_EMAIL_SIGNUP_ENABLED: "false"
      LOWCODER_CREATE_WORKSPACE_ON_SIGNUP: "true"
      LOWCODER_DB_ENCRYPTION_PASSWORD: ${LOWCODER_DB_ENCRYPTION_PASSWORD}
      LOWCODER_DB_ENCRYPTION_SALT: ${LOWCODER_DB_ENCRYPTION_SALT}
      LOWCODER_CORS_DOMAINS: "*"
      LOWCODER_MAX_ORGS_PER_USER: 100
      LOWCODER_MAX_MEMBERS_PER_ORG: 1000
      LOWCODER_MAX_GROUPS_PER_ORG: 100
      LOWCODER_MAX_APPS_PER_ORG: 1000
      LOWCODER_MAX_DEVELOPERS: 50
      #
      # API-KEY secret - should be a string of at least 32 random characters
      #    - on linux/mac, generate one eg. with: head /dev/urandom | head -c 30 | shasum -a 256
      #
      LOWCODER_API_KEY_SECRET: ${LOWCODER_API_KEY_SECRET}
      LOWCODER_PLUGINS_DIR: "../plugins"
      LOWCODER_API_RATE_LIMIT: 50
      LOWCODER_WORKSPACE_MODE: SAAS
      LOWCODER_MARKETPLACE_PRIVATE_MODE: "true"
      # Lowcoder notification emails setup
      LOWCODER_ADMIN_SMTP_HOST: smtp.gmail.com
      LOWCODER_ADMIN_SMTP_PORT: 587
      LOWCODER_ADMIN_SMTP_USERNAME:
      LOWCODER_ADMIN_SMTP_PASSWORD:
      LOWCODER_ADMIN_SMTP_AUTH: "true"
      LOWCODER_ADMIN_SMTP_SSL_ENABLED: "false"
      LOWCODER_ADMIN_SMTP_STARTTLS_ENABLED: "true"
      LOWCODER_ADMIN_SMTP_STARTTLS_REQUIRED: "true"
      # Email used as sender in lost password email
      LOWCODER_EMAIL_NOTIFICATIONS_SENDER: info@localhost
      # Lowcoder superuser details
      LOWCODER_SUPERUSER_USERNAME: "${LOWCODER_SUPERUSER_USERNAME}"
      # If left blank, a password will be generated and written into api-service log
      LOWCODER_SUPERUSER_PASSWORD: "${LOWCODER_SUPERUSER_PASSWORD}"
    depends_on:
      lowcoder-mongodb:
        condition: service_healthy
        restart: true
      lowcoder-redis:
        condition: service_healthy
        restart: true
    volumes:
      - lowcoder_data:/lowcoder-stacks
      - lowcoder_assets_data:/lowcoder/assets
    healthcheck: #https://stackoverflow.com/questions/71101967/how-should-i-use-grep-in-docker-compose-healthcheck
      test: curl -sS http://lowcoder-api-service:8080  | grep -c "Lowcoder API is up and runnig" > /dev/null
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - exist

  lowcoder-node-service:
    image: lowcoderorg/lowcoder-ce-node-service:2.7.6
    container_name: lowcoder-node-service
    # Enabled ports to be able to access backend from host
    # ports:
    #   - "6060:6060"
    environment:
      LOWCODER_PUID: "${EXIST_PUID:-1000}"
      LOWCODER_PGID: "${EXIST_PGID:-1000}"
      LOWCODER_API_SERVICE_URL: "http://lowcoder-api-service:8080"
    restart: unless-stopped
    # Node service for query execution. 1G, not 512M: V8 sizes its heap from the
    # cgroup limit and at 512M this crash-loops on startup with
    # "FatalProcessOutOfMemory" before it ever listens on 6060 — which then
    # blocks lowcoder-frontend, whose depends_on requires it healthy.
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      lowcoder-api-service:
        condition: service_healthy
        restart: true
    healthcheck: #https://stackoverflow.com/questions/71101967/how-should-i-use-grep-in-docker-compose-healthcheck
      test: curl -sS http://lowcoder-node-service:6060  | grep -c "Lowcoder Node Service is up and running" > /dev/null
      interval: 3s
      timeout: 5s
      retries: 10
      # Setup (a chown of node_modules to LOWCODER_PUID) runs before the service
      # listens, so the 30s of retries above can expire on a cold volume before
      # it is up. That marks it unhealthy and lowcoder-frontend's
      # `condition: service_healthy` then refuses to start at all.
      start_period: 300s
    networks:
      - exist

  ##
  ## Start Lowcoder web frontend
  ##
  lowcoder-frontend:
    image: lowcoderorg/lowcoder-ce-frontend:2.7.6
    container_name: lowcoder-frontend
    # ports disabled — access via https://lowcoder.<domain> (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - 43000:3000
    environment:
      LOWCODER_PUID: "${EXIST_PUID:-1000}"
      LOWCODER_PGID: "${EXIST_PGID:-1000}"
      LOWCODER_MAX_REQUEST_SIZE: 20m
      LOWCODER_MAX_QUERY_TIMEOUT: 120
      LOWCODER_API_SERVICE_URL: "http://lowcoder-api-service:8080"
      LOWCODER_NODE_SERVICE_URL: "http://lowcoder-node-service:6060"
    restart: unless-stopped
    # nginx serving the built app.
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      lowcoder-node-service:
        condition: service_healthy
        restart: true
      lowcoder-api-service:
        condition: service_healthy
        restart: true
    volumes:
      - lowcoder_assets_data:/lowcoder/assets
    healthcheck:
      test: curl --fail http://lowcoder-frontend:3000 || exit 1
      interval: 5s
      retries: 10
      start_period: 10s
      timeout: 10s
    networks:
      - exist

x-exist-volumes:
  lowcoder_data: { nfs: true }
  lowcoder_assets_data: { nfs: true }
  lowcoder_mongo_data: { db: true }
  lowcoder_mongo_config_data: { db: true }
  lowcoder_redis_cache: { db: true }

networks:
  exist:
    external: true
