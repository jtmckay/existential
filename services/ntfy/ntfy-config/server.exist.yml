# ./ntfy-config/server.yml
# base-url is set via NTFY_BASE_URL in docker-compose.exist.yml (env wins over
# this file), so it follows EXIST_DOMAIN without re-rendering.
# base-url: "https://ntfy.example.com"
listen-http: ":80"
enable-login: true
enable-signup: false

auth-file: "/var/lib/ntfy/user.db"
auth-default-access: "deny-all"

# Users, tokens, and access rules are created via: ./existential.sh run ntfy setup

cache-file: "/var/lib/ntfy/cache.db"
attachment-cache-dir: "/var/lib/ntfy/attachments"
