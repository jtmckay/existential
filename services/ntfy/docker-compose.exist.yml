services:
  ntfy:
    container_name: ntfy
    image: binwiederhier/ntfy:v2.27.0
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    restart: unless-stopped
    # Go binary with a SQLite message cache; 14-17 MiB measured idle, publishing,
    # holding open subscriber connections, and receiving an attachment upload.
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - exist
    # Loopback only: nothing in Core listens on the LAN. existential.sh puts
    # this behind `tailscale serve` at https://<machine>.<tailnet>.ts.net:8443;
    # the Caddy add-on reaches the container over the exist network instead.
    ports:
      - "127.0.0.1:44680:80"
    # entrypoint.sh creates the admin and bot users from the env below, then
    # execs `ntfy serve`. server.yml denies every publish by default, so without
    # it a fresh install would accept nothing.
    entrypoint: /entrypoint.sh
    command:
      - serve
    environment:
      - TZ=${NTFY_TZ} # optional: set desired timezone
      # entrypoint.sh picks the base URL from these at container start: the
      # tailnet name when there is one, else https://ntfy.<domain>. ntfy reads
      # NTFY_<KEY> for any server.yml key and env wins, so no re-render.
      - NTFY_BASE_URL=${NTFY_BASE_URL:-}
      - EXIST_TAILNET_NAME=${EXIST_TAILNET_NAME:-}
      - EXIST_DOMAIN=${EXIST_DOMAIN:-}
      # Your login for the web UI and the mobile apps (services/ntfy/.env).
      - NTFY_ADMIN_USER=${NTFY_ADMIN_USER:-}
      - NTFY_ADMIN_PASSWORD=${NTFY_ADMIN_PASSWORD:-}
      # The publisher every service shares — named once in .env.shared so the
      # sending and receiving halves can never disagree about the credential.
      - NTFY_BOT_USER=${EXIST_NTFY_USER:-}
      - NTFY_BOT_PASSWORD=${EXIST_NTFY_PASSWORD:-}
    volumes:
      # Message + attachment cache (transient, TTL'd) — a _cache, not backed up.
      - ntfy_cache:/var/lib/ntfy
      - ./ntfy-config:/etc/ntfy:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
    # Confirmed against a real v2.27.0 container: /v1/health returns
    # {"healthy":true} with no auth required, and the image ships wget (no
    # curl) — matches the CMD-SHELL below.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

x-exist-volumes:
  ntfy_cache: {}
