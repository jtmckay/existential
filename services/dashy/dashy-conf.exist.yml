# Dashy dashboard config — `<slug>.<domain>` convention.
#
# THIS FILE IS THE TEMPLATE. It renders to dashy-conf.yml on EVERY
# ./existential.sh run, so a change to the stack domain
# propagates here like it does everywhere else. Edits to the rendered
# dashy-conf.yml are overwritten — unless the user claims it by flipping the
# EXIST_KEEP line in its header to true, after which the file is theirs and this
# template stops driving it.
#
# Note: the bare-token substitution rewrites prose too, so avoid writing the
# domain variable's name in these comments — it would be replaced with its value.
#
# SCOPE: this dashboard lists the CORE stack only (src/quests/00-core.md) — the
# services every install has. Anything else you enable is yours to add: claim the
# rendered dashy-conf.yml (EXIST_KEEP=true in its header) and edit it on the host,
# so a later ./existential.sh run cannot overwrite your additions.
#
# Each item has TWO adjacent blocks: the active one points at the live service
# (https://<slug>.<domain>), the commented one points at the public docs page. Flip
# the comment when a service is decommissioned, paused, or never deployed —
# users still get a landing page explaining what it is and where to find it.
#
# Slugs must match a reverse_proxy backend in
# hosting/caddy/Caddyfile.exist.Caddyfile (the source of truth for what exists —
# piHole resolves the whole domain with one wildcard record). Run
# `./existential.sh validate` to verify.
#
# Core services with no useful tile are deliberately absent. No HTTP endpoint
# of their own: redis, honcho (internal API only), wyoming-whisper and
# wyoming-piper (reached by Home Assistant over the Wyoming protocol), loki
# (Grafana is the window onto it), decree (background daemon), and caddy
# itself. Has an endpoint but nothing a browser tile can show: automation-webhook
# is a POST-only, bearer-authed inbox receiver with no GET route worth linking
# (services/automation/webhook/README.md). Firecrawl gets a tile below, but its
# active block points at the docs page, not the live service — see the item
# for why.
#
# Dashy's native `statusCheck: true` pings the URL on a schedule and overlays
# a red dot when unreachable. That covers runtime health; the comment-flip
# covers "not enabled on either machine."
#
# The check runs server-side, inside the dashy container — not in your browser —
# and Caddy's leaf is signed by the stack's private CA, which that container does
# not trust. Hence `statusCheckAllowInsecure: true` on every item: without it
# every tile reports "unable to verify leaf certificate" while the service is
# perfectly healthy. Copy the flag onto any item you add.
#
# Icon reference:
#   https://dashy.to/docs/icons/  (hl-*, si-*, fas fa-*)

pageInfo:
  title: Existential
  description: Self-hosted homelab dashboard
  navLinks:
    - title: Docs
      path: https://existential.company/docs

appConfig:
  theme: colorful
  layout: auto
  statusCheckInterval: 60         # ping every 60s
  faviconApi: local
  # The rendered dashy-conf.yml is regenerated on every ./existential.sh run, so
  # Dashy's "save config to disk" would be silently undone. Disable it and keep
  # this file the single source of truth. Browser-local saves still work.
  preventWriteToDisk: true

sections:
  - name: Interface
    icon: fas fa-robot
    items:
      - title: Hermes
        url: https://hermes-agent-dashboard.EXIST_DOMAIN
        # url: https://existential.company/docs/ai/hermes
        icon: fas fa-frog
        statusCheck: true
        statusCheckAllowInsecure: true
        description: The agent — routing, sessions and ops dashboard

      - title: Home Assistant
        url: https://homeassistant.EXIST_DOMAIN
        # url: https://existential.company/docs/services/homeassistant
        icon: hl-home-assistant
        statusCheck: true
        statusCheckAllowInsecure: true
        description: Smart home automation, plus voice via wyoming-whisper/piper
      - title: Nextcloud
        url: https://nextcloud.EXIST_DOMAIN
        # url: https://existential.company/docs/storage/nextcloud
        icon: si-nextcloud
        statusCheck: true
        statusCheckAllowInsecure: true
        description: File sync + collaboration

      - title: code-server
        url: https://code-server.EXIST_DOMAIN
        # url: https://existential.company/docs/services/code-server
        # si-coder, not si-visualstudiocode: dashy resolves si-* against the
        # simple-icons package BUNDLED in its image (16.27.1 — verified by
        # listing /app/node_modules/simple-icons/icons), and that set has no
        # Microsoft/VS Code icon, so the tile rendered as a broken image. Coder
        # is who makes code-server, and that icon is in the bundle.
        icon: si-coder
        statusCheck: true
        statusCheckAllowInsecure: true
        description: Editor and terminal over the shared workspace — the same tree the agent works in


  - name: Infrastructure
    icon: fas fa-hard-drive
    items:
      - title: Ollama
        url: https://ollama.EXIST_DOMAIN
        # url: https://existential.company/docs/ai/ollama
        icon: si-ollama
        statusCheck: true
        statusCheckAllowInsecure: true
        description: Local models (API — every other AI service talks to this)

      - title: OpenViking
        url: https://openviking.EXIST_DOMAIN
        # url: https://existential.company/docs/ai/openviking
        icon: fas fa-database
        statusCheck: true
        statusCheckAllowInsecure: true
        description: Context database — notes, scraped resources, agent memory

      - title: SeaweedFS
        url: https://seaweedfs.EXIST_DOMAIN
        # url: https://existential.company/docs/storage/seaweedfs
        icon: fas fa-database
        statusCheck: true
        statusCheckAllowInsecure: true
        description: S3-compatible object store (admin UI)

  - name: Observability
    icon: fas fa-chart-line
    items:
      - title: Grafana
        url: https://grafana.EXIST_DOMAIN
        # url: https://existential.company/docs/hosting/grafana
        icon: si-grafana
        statusCheck: true
        statusCheckAllowInsecure: true
        description: Decree run logs and metrics — start here when a routine misbehaves

      - title: Prometheus
        url: https://prometheus.EXIST_DOMAIN
        # url: https://existential.company/docs/hosting/prometheus
        icon: si-prometheus
        statusCheck: true
        statusCheckAllowInsecure: true
        description: Metrics store behind Grafana (raw query UI)

      - title: ntfy
        url: https://ntfy.EXIST_DOMAIN
        # url: https://existential.company/docs/services/ntfy
        icon: si-ntfy
        statusCheck: true
        statusCheckAllowInsecure: true
        description: Push notifications — where finished automations report in
