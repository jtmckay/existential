services:
  nocodb-postgres:
    container_name: nocodb-postgres
    image: postgres:16.6
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    restart: unless-stopped
    # Postgres holding table metadata and data.
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - exist
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_PASSWORD: ${NOCODB_POSTGRES_PASSWORD}
      POSTGRES_USER: ${NOCODB_POSTGRES_USER}
    volumes:
      # Postgres — db: true. TODO: pg_dump → volumes/nocodb_pg_data_backup.
      - nocodb_pg_data:/var/lib/postgresql/data
      # - ./ncpg_data:/var/lib/postgresql/data # Local volume for Postgres data
    healthcheck:
      interval: 10s
      retries: 10
      test: 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      timeout: 2s

  # UI interface at http://localhost:48080/
  nocodb:
    container_name: nocodb
    image: "nocodb/nocodb:2026.08.1"
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    restart: unless-stopped
    # Node app server over the metadata DB.
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - exist
    depends_on:
      nocodb-postgres:
        condition: service_healthy
    environment:
      NC_DB: "pg://nocodb-postgres:5432?u=${NOCODB_POSTGRES_USER}&p=${NOCODB_POSTGRES_PASSWORD}&d=nocodb"
      NC_ADMIN_EMAIL: ${NOCODB_ADMIN_EMAIL}
      NC_ADMIN_PASSWORD: ${NOCODB_ADMIN_PASSWORD}
    # ports disabled — access via https://nocodb.<domain> (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - 48080:8080
    volumes:
      - nocodb_data:/usr/app/data
      # - ./nc_data:/usr/app/data # Local volume for NocoDB data

x-exist-volumes:
  nocodb_data: { nfs: true }
  nocodb_pg_data: { db: true }

networks:
  exist:
    external: true
