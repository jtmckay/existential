routine_source: /work/.decree/shared_routines
commands:
  ai_router: opencode run {prompt}
  ai_interactive: opencode
max_attempts: 3
max_depth: 100
max_log_size: 2097152
# The catch-all, not develop. A message that arrives with no routine and no
# router to pick one gets logged and dropped rather than handed to develop,
# which would put an unrouted message in front of an agent with terminal and
# write_file access.
default_routine: route-failed
hooks:
  beforeAll: ""
  afterAll: ""
  beforeEach: /work/.decree/lib/hooks/config-watch.sh
  afterEach: /work/.decree/lib/hooks/afterEach.sh
shared_routines:
  actual-budget:
    enabled: false
  actual-budget-parse:
    enabled: false
  check-disabled-runs:
    enabled: true
  clean-runs:
    enabled: true
  comfy-image-text:
    enabled: false
  comfy-image-text-image:
    enabled: false
  comfy-video-i2v:
    enabled: false
  develop:
    enabled: false
  agent-task:
    enabled: false
  # Routing: hermes-router picks a department and queues its dept-* routine.
  # route-failed is the catch-all and is on by default — it is what decree
  # falls back to, so disabling it would strand unroutable messages.
  hermes-router:
    enabled: false
  route-failed:
    enabled: true
  dept-sales:
    enabled: false
  dept-research:
    enabled: false
  file-processor:
    enabled: false
  minio-bucket:
    enabled: true
  minio-service-account:
    enabled: true
  minio-router:
    enabled: false
  gmail:
    enabled: false
  gmail-sync:
    enabled: false
  notes:
    enabled: false
  note-triage:
    enabled: false
  note-develop:
    enabled: false
  # The fan-out alternative to note-develop: hands the flagged idea to
  # dept-research and dept-sales, so those two must be on for it to land.
  idea-workup:
    enabled: false
  notify:
    enabled: true
  # On by default, and it quiets itself as the stack stays green — see the
  # routine's header. The person who most needs triage is the one who does not
  # know it exists, so it cannot be opt-in.
  triage:
    enabled: true
  # No cron names these three: they run only when a MIGRATION does. Left
  # disabled/unlisted they made every ollama and minio migration a no-op --
  # decree created the run, declined the routine, and `decree process` stopped
  # at that first dead letter, hiding every migration behind it.
  ollama-pull:
    enabled: true
  check-versions:
    enabled: true
  service-health:
    enabled: true
