services:
  appsmith:
    container_name: appsmith
    image: index.docker.io/appsmith/appsmith-ce:v2.3
    restart: unless-stopped
    # Bundles its own JVM backend, Mongo client and nginx in one container.
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - exist
    # ports disabled — access via https://appsmith.<domain> (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - "44080:80"
    volumes:
      # Bundles MongoDB + Redis internally — must be local (NFS corrupts WiredTiger).
      - appsmith_data:/appsmith-stacks

  # nuke:
  #   image: node:24-alpine
  #   entrypoint: >
  #     sh -c '
  #       sleep 500
  #     '
  #   restart: "no"
  #   volumes:
  #     - appsmith_data:/appsmith-stacks

  appsmith-decree:
    container_name: appsmith-decree
    image: existential/decree:local  # shared image, built by existential-adhoc
    pull_policy: never
    restart: unless-stopped
    # Sidecar: bash.
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - exist
    environment:
      - DECREE_DAEMON=true
      - DECREE_SIDECAR=true
      - DECREE_INTERVAL=2
      - IN_CONTAINER=1
      - EXIST_BACKUP_RCLONE_REMOTE=${EXIST_BACKUP_RCLONE_REMOTE}
    volumes:
      - ./decree:/work/.decree:z
      - ./exist.test.sh:/work/exist.test.sh:ro,z
      - ../../src/test/exist-test.sh:/src/test/exist-test.sh:ro,z
      - ../../automations/shared_routines:/work/.decree/shared_routines:ro,z
      - ../../automations/lib:/work/.decree/lib:ro,z
      - ../../automations/runs:/work/.decree/runs:z
      - ../../automations/secrets:/secrets:ro,z
      # TODO: live-dir tar of a running Mongo is not crash-consistent — replace with a
      # mongodump → volumes/appsmith_data_backup. Not wired up yet.
      - appsmith_data:/volumes/appsmith_data
    tty: false

x-exist-volumes:
  appsmith_data: { db: true }

networks:
  exist:
    external: true
