services:
  mealie:
    container_name: mealie
    image: ghcr.io/mealie-recipes/mealie:v3.23.1
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    restart: unless-stopped
    # Python API plus recipe scraping.
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - exist
    volumes:
      - mealie_data:/app/data/
    # ports disabled — access via https://mealie.<domain> (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - 49009:9000
    environment:
      ALLOW_SIGNUP: "false"
      LOG_LEVEL: "INFO"
      BASE_URL: ${MEALIE_BASE_URL:-https://mealie.$EXIST_DOMAIN}

      DB_ENGINE: postgres # Optional: 'sqlite', 'postgres'
      # =====================================
      # Postgres Config
      POSTGRES_USER: ${MEALIE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${MEALIE_POSTGRES_PASSWORD}
      POSTGRES_SERVER: mealie-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: mealie
      # =====================================
      # Email Configuration
      # SMTP_HOST=
      # SMTP_PORT=587
      # SMTP_FROM_NAME=Mealie
      # SMTP_AUTH_STRATEGY=TLS # Options: 'TLS', 'SSL', 'NONE'
      # SMTP_FROM_EMAIL=
      # SMTP_USER=
      # SMTP_PASSWORD=
  mealie-postgres:
    container_name: mealie-postgres
    image: postgres:17
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    restart: unless-stopped
    # Postgres at recipe-library scale.
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - exist
    environment:
      POSTGRES_PASSWORD: ${MEALIE_POSTGRES_PASSWORD}
      POSTGRES_USER: ${MEALIE_POSTGRES_USER}
    volumes:
      # Postgres — db: true. Backed up logically by the mealie-db-backup crons.
      - mealie_pg_data:/var/lib/postgresql/data

x-exist-volumes:
  mealie_data: { nfs: true }
  mealie_pg_data: { db: true }

networks:
  exist:
    external: true
