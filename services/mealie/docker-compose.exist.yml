services:
  mealie:
    container_name: mealie
    image: ghcr.io/mealie-recipes/mealie:v3.23.1
    # The image's own entrypoint (/app/run.sh) is a gosu/PUID-style init: it
    # only chowns /app and re-execs via gosu when it starts as root (uid 0) or
    # when the running uid already equals $PUID (default 911). Neither branch
    # fires under a plain `user:` override at a uid that is *not* 911 — but
    # that's fine here, verified against the real image: run.sh falls through
    # both checks and continues straight to `exec mealie` as whatever uid we
    # set, and the only path mealie writes at runtime is the bind-mounted
    # /app/data — which generate-compose.ts creates already owned by
    # EXIST_PUID:EXIST_PGID. No root step is needed.
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    restart: unless-stopped
    # Python API plus recipe scraping (BeautifulSoup/recipe-scrapers + NLTK for
    # ingredient parsing — no torch/playwright in this image). Measured against
    # the real image (v3.23.1, postgres backend): ~260-300MiB idle after first
    # boot settles, ~295MiB after scraping several recipe URLs with images
    # (thumbnails are generated on import). 768M keeps ~2.5x that headroom.
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - exist
    depends_on:
      mealie-postgres:
        condition: service_healthy
    volumes:
      - mealie_data:/app/data/
    # ports disabled — access via https://mealie.<domain> (Caddy + pihole required)
    # Uncomment to expose directly:
    #   ports:
    #     - 49009:9000
    #
    # No `healthcheck:` here on purpose — the image already bakes one (verified
    # via `docker inspect`: CMD-SHELL $MEALIE_HOME/healthcheck.sh, which curls
    # the same /api/app/about that exist.test.sh probes), so a compose-level
    # override would just duplicate it.
    #
    # AI-powered recipe parsing (v3's "AI Providers" feature — default/audio/
    # image roles, used for import-from-image and import-from-video/audio) is
    # NOT wired here on purpose: verified against the real image's settings.py
    # that as of v3.23.1 upstream moved this off environment variables — the
    # only OpenAI-related env var left is OPENAI_CUSTOM_PROMPT_DIR (a prompt
    # override path). Providers (base_url/api_key/model, per role) are created
    # through Admin > AI Providers in the UI and stored per-group in postgres
    # (migration 2187537c52b8_add_table_for_ai_providers), so there is no
    # `.env.exist.shared` model-role key for this service to read — see
    # site/docs/services/mealie.md for how to point it at ollama manually.
    environment:
      ALLOW_SIGNUP: "false"
      LOG_LEVEL: "INFO"
      BASE_URL: ${MEALIE_BASE_URL:-https://mealie.$EXIST_DOMAIN}

      DB_ENGINE: postgres # Optional: 'sqlite', 'postgres'
      # =====================================
      # Postgres Config
      POSTGRES_USER: ${MEALIE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${MEALIE_POSTGRES_PASSWORD}
      POSTGRES_SERVER: mealie-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: mealie
      # =====================================
      # Email Configuration
      # SMTP_HOST=
      # SMTP_PORT=587
      # SMTP_FROM_NAME=Mealie
      # SMTP_AUTH_STRATEGY=TLS # Options: 'TLS', 'SSL', 'NONE'
      # SMTP_FROM_EMAIL=
      # SMTP_USER=
      # SMTP_PASSWORD=
  mealie-postgres:
    container_name: mealie-postgres
    image: postgres:17
    user: "${EXIST_PUID:-1000}:${EXIST_PGID:-1000}"
    restart: unless-stopped
    # Measured against the real image on a freshly initialized volume: ~93-100MiB
    # idle (stock 128MB shared_buffers is over half this limit — raise the limit
    # before raising that). 256M is ~2.5x measured idle at recipe-library scale.
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - exist
    environment:
      POSTGRES_PASSWORD: ${MEALIE_POSTGRES_PASSWORD}
      POSTGRES_USER: ${MEALIE_POSTGRES_USER}
      # Must match the app's POSTGRES_DB above. Without it initdb names the
      # database after POSTGRES_USER and mealie connects to a `mealie` database
      # that was never created.
      POSTGRES_DB: mealie
    volumes:
      # Postgres — db: true. Backed up logically by the mealie-db-backup crons.
      - mealie_pg_data:/var/lib/postgresql/data
    # mealie exits on a failed connect rather than retrying, so without this it
    # restart-loops through the ~30s initdb takes on a cold volume. Same shape
    # as nocodb-postgres.
    healthcheck:
      test: 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 10s
      timeout: 2s
      retries: 10

x-exist-volumes:
  mealie_data: { nfs: true }
  mealie_pg_data: { db: true }

networks:
  exist:
    external: true
